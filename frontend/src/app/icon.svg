<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="paper-blue" x1="12" y1="6" x2="84" y2="94" gradientUnits="userSpaceOnUse">
      <stop stop-color="#266FE1"/>
      <stop offset=".52" stop-color="#2167E5"/>
      <stop offset="1" stop-color="#1959D7"/>
    </linearGradient>
    <linearGradient id="fold-paper" x1="54" y1="58" x2="82" y2="85" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset=".3" stop-color="#C9DAFC"/>
      <stop offset=".68" stop-color="#9DBCF7"/>
      <stop offset="1" stop-color="#B8D1FF"/>
    </linearGradient>
    <linearGradient id="fold-shade" x1="69" y1="67" x2="84" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2670E1" stop-opacity=".24"/>
      <stop offset="1" stop-color="#82B0FB" stop-opacity="0"/>
    </linearGradient>
    <filter id="fold-softness" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="fold-light" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation=".65"/>
    </filter>
    <clipPath id="paper-outline">
      <path d="M26 3H74C86.7 3 97 13.3 97 26V54.5C97 58.2 95.5 61 92.5 64L62 94C60 96 56.5 97 52 97H26C13.3 97 3 86.7 3 74V26C3 13.3 13.3 3 26 3Z"/>
    </clipPath>
    <clipPath id="fold-outline">
      <path d="M51.5 97V72C51.5 62.6 59.1 55 68.5 55H97C96.7 59 95.3 61.3 92.5 64L62 94C59.1 96.7 55.5 97 51.5 97Z"/>
    </clipPath>
  </defs>
  <!-- The silhouette has a 23/94 corner radius and a fold spanning 48% of the paper. -->
  <g clip-path="url(#paper-outline)">
    <path d="M26 3H74C86.7 3 97 13.3 97 26V54.5C97 58.2 95.5 61 92.5 64L62 94C60 96 56.5 97 52 97H26C13.3 97 3 86.7 3 74V26C3 13.3 13.3 3 26 3Z" fill="url(#paper-blue)"/>
    <path d="M53 97V72C53 63.5 60 56.5 69 56.5H97" stroke="#1046BA" stroke-opacity=".28" stroke-width="3" filter="url(#fold-softness)"/>
    <path d="M51.5 97V72C51.5 62.6 59.1 55 68.5 55H97C96.7 59 95.3 61.3 92.5 64L62 94C59.1 96.7 55.5 97 51.5 97Z" fill="url(#fold-paper)"/>
    <g clip-path="url(#fold-outline)">
      <path d="M58 98 99 57 103 69 72 102Z" fill="url(#fold-shade)" filter="url(#fold-softness)"/>
      <path d="M51.8 94V72C51.8 62.8 59.5 55.5 68.5 55.5H94" stroke="#FFFFFF" stroke-opacity=".65" stroke-width="1.1" filter="url(#fold-light)"/>
    </g>
  </g>
</svg>
