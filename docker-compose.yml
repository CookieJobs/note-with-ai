services:
  # MongoDB 服务
  mongo:
    image: mongo:6
    container_name: note-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

  # Redis 服务
  redis:
    image: redis:7-alpine
    container_name: note-redis
    ports:
      - "6380:6379"
    restart: always

  # 后端服务
  backend:
    build: ./backend
    container_name: note-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://mongo:27017/note-with-ai
      - REDIS_URL=redis://redis:6379
      # 这里使用变量，部署时通过 .env 文件或命令行传入
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - TAVILY_SEARCH_TIMEOUT_MS=${TAVILY_SEARCH_TIMEOUT_MS:-8000}
      - TAVILY_SEARCH_LANGUAGE=${TAVILY_SEARCH_LANGUAGE:-zh}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION}
      - EMBEDDING_MODALITY=${EMBEDDING_MODALITY}
      - EMBEDDING_QUERY_INPUT_TYPE=${EMBEDDING_QUERY_INPUT_TYPE}
      - EMBEDDING_DOCUMENT_INPUT_TYPE=${EMBEDDING_DOCUMENT_INPUT_TYPE}
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET}
      - ADMIN_JWT_EXPIRES_IN=${ADMIN_JWT_EXPIRES_IN:-8h}
      - ADMIN_ENCRYPTION_KEY=${ADMIN_ENCRYPTION_KEY}
      - QQ_EMAIL_USER=${QQ_EMAIL_USER}
      - QQ_EMAIL_PASS=${QQ_EMAIL_PASS}
    depends_on:
      - mongo
      - redis
    restart: always

  # P16＋P17 独立自动研究进程：仅明确指定 profile 时启动。
  inspiration-worker:
    profiles: ["inspiration"]
    build: ./backend
    command: ["node", "dist/scripts/run_inspiration_worker.js"]
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/note-with-ai
      - REDIS_URL=redis://redis:6379
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - TAVILY_SEARCH_TIMEOUT_MS=${TAVILY_SEARCH_TIMEOUT_MS:-8000}
      - TAVILY_SEARCH_LANGUAGE=${TAVILY_SEARCH_LANGUAGE:-zh}
      - INSPIRATION_AUTO_CONCURRENCY=${INSPIRATION_AUTO_CONCURRENCY:-2}
      - INSPIRATION_AUTO_DAILY_LIMIT=${INSPIRATION_AUTO_DAILY_LIMIT:-20}
      - INSPIRATION_WORKER_POLL_MS=${INSPIRATION_WORKER_POLL_MS:-60000}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET}
      - ADMIN_ENCRYPTION_KEY=${ADMIN_ENCRYPTION_KEY}
      - QQ_EMAIL_USER=${QQ_EMAIL_USER}
      - QQ_EMAIL_PASS=${QQ_EMAIL_PASS}
    depends_on:
      - mongo
    restart: always

  # 前端服务
  # 前端服务
  frontend:
    build:
      context: ./frontend
      args:
        - BACKEND_URL=http://backend:3001
        - NODE_BUILD_MEMORY=${FRONTEND_NODE_BUILD_MEMORY:-768}
        - NEXT_BUILD_WORKERS=${FRONTEND_NEXT_BUILD_WORKERS:-1}
    container_name: note-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:3001
    depends_on:
      - backend
    restart: always

volumes:
  mongo-data:
