/* =========================================================
   NoteWithAI · 记忆卡牌 / MEMORY DECK

   ========================================================= */
:root {
  --bg: #eef1ff;
  --bg-2: #e7ecff;
  --surface: #ffffff;
  --surface-soft: #f7f9ff;
  --ink: #171f35;
  --ink-2: #4d5a75;
  --ink-3: #5f6b83;
  --line: #d9deee;
  --line-strong: #c3cce4;
  --blue: #266fe1;
  --blue-hover: #1d5bc0;
  --blue-soft: #e5eeff;
  --blue-ink: #1d5bc0;
  --coral: #ff806d;
  --coral-soft: #ffe8e3;
  --yellow: #ffd45e;
  --mint: #8be3c4;
  --lilac: #c9b8ff;
  --sky: #8fd0ff;
  --cream: #fff6dc;
  --danger: #c34444;
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --font-mono: "SFMono-Regular", "SF Mono", "JetBrains Mono", Consolas, "Liberation Mono", Menlo, monospace;
  --header-h: 74px;
  --radius: 12px;
  --radius-card: 16px;
  --shadow-card: 0 3px 0 rgba(22, 31, 53, 0.1), 0 16px 32px rgba(32, 52, 91, 0.12);
  --shadow-float: 0 20px 50px rgba(30, 47, 83, 0.18);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --dur: 170ms;
  --z-chip: 60;
  --z-modal: 90;
  --z-toast: 100;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 85% 4%, rgba(255, 128, 109, 0.14), transparent 23%),
    radial-gradient(circle at 10% 94%, rgba(38, 111, 225, 0.12), transparent 27%),
    radial-gradient(circle at 60% 40%, rgba(201, 184, 255, 0.13), transparent 30%);
}
h1, h2, h3, h4, p, figure, blockquote, dl, dd { margin: 0; }

::selection { background: rgba(38, 111, 225, 0.22); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }

.sr-only {
  position: absolute !important;
  width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}
.hidden { display: none !important; }
.serif { font-family: var(--font-serif); }

}
.icon.sm { width: 15px; height: 15px; }

/* ===== memorydeck base: modal/field/pick/toast (src lines 1317-1449) ===== */
/* =========================================================
   Modal / card editor / card picker
   ========================================================= */
.modal-layer {
  position: fixed;
  inset: 0;
  z-index: var(--z-modal);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
}
.modal-scrim {
  position: absolute;
  inset: 0;
  background: rgba(18, 28, 51, 0.34);
  animation: fade-in var(--dur) var(--ease);
}
.modal-sheet {
  position: relative;
  z-index: 1;
  width: min(560px, 100%);
  max-height: calc(100dvh - 44px);
  overflow-y: auto;
  padding: 24px;
  border-radius: 20px;
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow-float);
  animation: modal-in 190ms var(--ease);
}
.modal-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
}
.modal-title { color: var(--ink); font-size: 25px; font-weight: 800; line-height: 1.25; letter-spacing: -0.03em; }
.modal-sub { margin-top: 4px; color: var(--ink-3); font-size: 10.5px; }
.modal-close {
  display: grid;
  place-items: center;
  width: 31px; height: 31px;
  flex: none;
  border-radius: 50%;
  color: var(--ink-3);
}
.modal-close:hover { background: var(--bg-2); color: var(--ink); }
.modal-close .icon { width: 16px; height: 16px; }
.modal-body { margin-top: 14px; }
.field { margin-bottom: 15px; }
.field label { display: block; margin-bottom: 6px; color: var(--ink-2); font-size: 10.5px; font-weight: 600; }
.field input, .field textarea {
  width: 100%;
  padding: 10px 11px;
  border: 1px solid #7d89a3;
  border-radius: 10px;
  background: var(--surface-soft);
  color: var(--ink);
  font-size: 13.5px;
  line-height: 1.7;
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.field textarea { min-height: 175px; resize: vertical; }
.field input:focus, .field textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(38, 111, 225, 0.1); outline: none; }
.modal-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 19px;
  padding-top: 13px;
  border-top: 1px solid var(--line);
}
.modal-actions .modal-cancel { margin-right: auto; }
.pick-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  max-height: min(56vh, 480px);
  overflow-y: auto;
}
.pick-card {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  min-height: 106px;
  padding: 11px;
  border-radius: 11px;
  background: var(--card-bg, var(--yellow));
  color: var(--ink);
  text-align: left;
  box-shadow: 0 2px 0 rgba(22, 31, 53, 0.08);
  transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.pick-card:hover { transform: translateY(-2px); box-shadow: 0 3px 0 rgba(22, 31, 53, 0.08), 0 7px 12px rgba(32, 52, 91, 0.08); }
.pick-card .pick-date { color: #39435a; font-family: var(--font-mono); font-size: 8px; }
.pick-card strong {
  display: -webkit-box;
  overflow: hidden;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  margin-top: 5px;
  color: var(--ink);
  font-size: 12px;
  font-weight: 750;
  line-height: 1.4;
}
.pick-card span { margin-top: auto; padding-top: 7px; color: #39435a; font-size: 8.5px; }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes modal-in { from { opacity: 0; transform: translateY(6px) scale(0.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
.toast {
  position: fixed;
  left: 50%;
  bottom: 23px;
  z-index: var(--z-toast);
  transform: translateX(-50%);
  max-width: min(440px, calc(100vw - 30px));
  padding: 9px 14px;
  border-radius: 999px;
  background: var(--ink);
  color: #fff;
  box-shadow: 0 10px 25px rgba(20, 30, 52, 0.2);
  font-size: 11px;
  line-height: 1.5;
  text-align: center;
  animation: toast-in 180ms var(--ease);
}
.toast.is-out { animation: toast-out 150ms var(--ease) forwards; }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 5px); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes toast-out { to { opacity: 0; transform: translate(-50%, 4px); } }


/* =========================================================
   WORKSPACE SHELL · 记忆卡牌工作区
   Sidebar + topbar + scroll view, adapted from the Memory Deck
   visual language (blue-lilac canvas, paper cards, pill nav).
   ========================================================= */
:root {
  --sidebar-w: 264px;
  --sidebar-w-collapsed: 78px;
  --topbar-h: 62px;
  --radius-sheet: 18px;
  --radius-panel: 16px;
  --shadow-sheet: 0 3px 0 rgba(22, 31, 53, 0.07), 0 18px 38px rgba(32, 52, 91, 0.1);
  --shadow-soft: 0 2px 0 rgba(22, 31, 53, 0.05), 0 8px 18px rgba(32, 52, 91, 0.06);
  --shadow-lift: 0 4px 0 rgba(22, 31, 53, 0.08), 0 20px 36px rgba(32, 52, 91, 0.14);
  --sidebar-bg: #e8edff;
  --topbar-bg: rgba(240, 243, 255, 0.9);
  --danger-soft: #ffe8e3;
  --mint-soft: #d9f9ee;
  --lilac-soft: #f0e8ff;
  --sky-soft: #e2f0ff;
}

html, body { height: 100%; }
body { overflow: hidden; }

.app {
  position: relative;
  z-index: 1;

  height: 100dvh;
  min-height: 0;

.sidebar {

  padding: 18px 14px 14px;

}
.side-brand-mark {

.side-collapse {

.side-scene {

.side-scene-head {

.side-search { position: relative; margin: 0 5px 8px; }
.side-search .icon {

.side-chat {

/* Collapsed sidebar (desktop preference) */

body.sidebar-collapsed .side-nav span,
body.sidebar-collapsed .side-scene,
body.sidebar-collapsed .account-copy,
body.sidebar-collapsed .account-caret,
body.sidebar-collapsed .side-collapse .icon { display: none; }
body.sidebar-collapsed .side-brand { justify-content: center; padding: 0; }
body.sidebar-collapsed .side-collapse {
  position: absolute;
  top: 62px;
  left: 50%;
  margin-left: 0;

/* ----- Workspace + topbar ---------------------------------------------- */
.workspace {

  flex-direction: column;
  min-width: 0;
  min-height: 0;
  height: 100dvh;
}
.topbar {
  position: relative;

  align-items: center;
  justify-content: space-between;
  gap: 18px;
  flex: none;
  height: var(--topbar-h);

  border-bottom: 1px solid rgba(196, 205, 228, 0.66);

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.crumbs {

/* ----- Notes home ------------------------------------------------------- */
.notes-page { padding-top: 30px; }

.notes-hero {

}
.capture-stack { position: relative; min-width: 0; }

}

  content: "";
  position: absolute;

.notes-list-section { margin-top: 36px; }
.notes-list { margin-top: 4px; }
.date-group { margin-top: 20px; }

.date-group-label {

}

/* =========================================================

   A white paper sheet with a coloured card peeking out behind
   it, so the Memory Deck stack survives without tinting long copy.
   ========================================================= */
.reading-page { padding-top: 22px; }

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  min-height: 30px;
  margin-bottom: 13px;
}
.reading-tools { display: flex; align-items: center; gap: 4px; }
.reading-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 330px;
  gap: 26px;
  align-items: start;
}
.reader-stack { position: relative; min-width: 0; padding: 0 6px 4px 0; }
.reader-stack::before {
  content: "";
  position: absolute;
  top: 9px;
  right: 0;
  bottom: -6px;
  left: 12px;
  z-index: 0;
  border-radius: var(--radius-sheet);

  box-shadow: 0 3px 0 rgba(22, 31, 53, 0.08);
}
.reader-stack::after {

  left: 20px;

  border-radius: var(--radius-sheet);

  position: absolute;
  top: -13px;
  left: 26px;

  align-items: center;
  gap: 7px;
  min-height: 27px;
  padding: 0 12px;
  border-radius: 999px;
  background: var(--card-bg, var(--yellow));
  color: var(--card-ink, #171f35);
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.02em;
  box-shadow: 0 3px 0 rgba(22, 31, 53, 0.1);
  transform: rotate(-1.2deg);
}
.reader-tab .tab-dot { width: 4px; height: 4px; border-radius: 50%; background: rgba(23, 31, 53, 0.45); }
.reader-title {
  margin-top: 6px;
  color: var(--ink);
  font-size: 34px;
  font-weight: 800;
  line-height: 1.3;
  letter-spacing: -0.034em;

.reader-meta {

.reader-foot {

.reader-actions {

  line-height: 1.65;
}
.related-list { display: flex; flex-direction: column; gap: 9px; }
.related-item {
  display: block;
  padding: 12px 13px;
  border-radius: 12px;
  background: var(--card-soft, var(--surface-soft));
  color: var(--card-ink, var(--ink));
  box-shadow: 0 2px 0 rgba(22, 31, 53, 0.05);
  transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.related-item:hover { transform: translateY(-2px); box-shadow: 0 3px 0 rgba(22, 31, 53, 0.06), 0 10px 20px rgba(32, 52, 91, 0.1); }
.related-item .related-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  color: var(--card-ink-soft, var(--ink-3));
  font-family: var(--font-mono);
  font-size: 8px;
}
.related-item .related-top .related-no { color: var(--card-ink, var(--ink)); font-weight: 600; }
.related-item strong {
  display: -webkit-box;
  overflow: hidden;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  margin-top: 6px;
  color: var(--card-ink, var(--ink));
  font-size: 12.5px;
  font-weight: 750;
  line-height: 1.5;
}
.related-item .related-why {
  display: flex;
  align-items: flex-start;
  gap: 5px;
  margin-top: 7px;
  color: var(--card-ink-soft, var(--ink-2));
  font-size: 10px;
  line-height: 1.65;
}
.related-item .related-why .icon { width: 11px; height: 11px; flex: none; margin-top: 2px; color: var(--coral); }
.related-empty { padding: 14px 4px 4px; color: var(--ink-3); font-size: 11px; line-height: 1.75; }
.related-foot { margin-top: 12px; padding: 10px 3px 1px; border-top: 1px solid var(--line); }
.related-foot .link-btn { font-size: 11px; }

/* ----- Drawer (related notes / mobile chat history) -------------------- */
.drawer-layer {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: flex;
  justify-content: flex-end;
}
.drawer-scrim {
  position: absolute;
  inset: 0;
  background: rgba(18, 28, 51, 0.34);
  animation: fade-in var(--dur) var(--ease);
}
.drawer-panel {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  width: min(392px, calc(100vw - 48px));
  height: 100%;
  padding: 20px;
  overflow-y: auto;
  background: var(--surface);
  box-shadow: var(--shadow-float);
  animation: drawer-in 240ms var(--ease);
}
@keyframes drawer-in { from { transform: translateX(28px); opacity: 0; } to { transform: none; opacity: 1; } }
.drawer-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
}
.drawer-head h2 { color: var(--ink); font-size: 19px; font-weight: 800; letter-spacing: -0.025em; }
.drawer-head p { margin-top: 3px; color: var(--ink-3); font-size: 10px; }
.drawer-body { margin-top: 14px; }
.drawer-body .related-item { margin-bottom: 9px; }

/* =========================================================
   EDITOR · 编辑
   ========================================================= */
.editor-page { padding-top: 22px; }
.editor-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  gap: 26px;
  align-items: start;
}
.editor-stack { position: relative; min-width: 0; }
.editor-stack::before {
  content: "";
  position: absolute;
  inset: 10px -5px -8px 10px;
  z-index: 0;
  border-radius: var(--radius-sheet);
  background: var(--card-bg, var(--sky));
  opacity: 0.5;
  transform: rotate(0.8deg);
}
.editor-card {
  position: relative;
  z-index: 1;
  padding: 26px 30px 22px;
  border-radius: var(--radius-sheet);
  background: var(--surface);
  box-shadow: 0 4px 0 rgba(22, 31, 53, 0.08), 0 22px 44px rgba(32, 52, 91, 0.12);
}
.editor-topline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 12px;
}
.editor-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 24px;
  padding: 0 9px;
  border-radius: 999px;
  background: var(--surface-soft);
  color: var(--ink-3);
  font-family: var(--font-mono);
  font-size: 8.5px;
}
.editor-status .status-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--mint); }
.editor-status.is-dirty { background: var(--cream); color: #7a5a12; }
.editor-status.is-dirty .status-dot { background: var(--coral); }
.editor-status.is-saving .status-dot { background: var(--blue); animation: pulse-dot 1s ease-in-out infinite; }
@keyframes pulse-dot { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
.editor-title-row { position: relative; display: flex; align-items: flex-start; gap: 10px; }
.editor-title {
  flex: 1;
  min-width: 0;
  width: 100%;
  padding: 2px 0;
  border: 0;
  background: transparent;
  color: var(--ink);
  font-size: 32px;
  font-weight: 800;
  line-height: 1.32;
  letter-spacing: -0.032em;
  outline: none;
}
.editor-title::placeholder { color: var(--ink-3); opacity: 0.75; }
.editor-title-ai { flex: none; margin-top: 7px; }
.ai-title-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 28px;
  padding: 0 10px;
  border-radius: 999px;
  background: var(--cream);
  color: #7a5a12;
  font-size: 10px;
  font-weight: 650;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.ai-title-chip:hover { background: var(--yellow); color: #4e3a09; }
.ai-title-chip .icon { width: 12px; height: 12px; }
.ai-title-chip.is-loading { opacity: 0.7; pointer-events: none; }
.editor-toolbar {
  position: sticky;
  top: 0;
  z-index: 6;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 2px;
  margin-top: 15px;
  padding: 5px;
  border-radius: 12px;
  background: var(--surface-soft);
  box-shadow: 0 1px 0 rgba(22, 31, 53, 0.04), 0 6px 16px rgba(32, 52, 91, 0.05);
}
.toolbar-btn {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 8px;
  color: var(--ink-2);
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.toolbar-btn:hover { background: var(--surface); color: var(--ink); box-shadow: 0 2px 6px rgba(31, 49, 85, 0.08); }
.toolbar-btn.is-active { background: var(--surface); color: var(--blue-ink); box-shadow: 0 2px 6px rgba(31, 49, 85, 0.08); }
.toolbar-btn .icon { width: 15px; height: 15px; }
.toolbar-sep { width: 1px; height: 17px; margin: 0 3px; background: var(--line); }
.toolbar-hint {
  margin-left: auto;
  padding-right: 6px;
  color: var(--ink-3);
  font-family: var(--font-mono);
  font-size: 8px;
  white-space: nowrap;
}
.editor-body {
  min-height: 380px;
  margin-top: 16px;
  color: var(--ink);
  font-size: var(--reading-size, 16.5px);
  line-height: 1.96;
  outline: none;
  overflow-wrap: anywhere;
}
.editor-body:empty::before {
  content: attr(data-placeholder);
  color: var(--ink-3);
  opacity: 0.72;
  pointer-events: none;
}
.editor-body p { margin: 0 0 1em; }
.editor-body h2 { margin: 1.4em 0 0.6em; font-size: 1.35em; font-weight: 800; letter-spacing: -0.02em; line-height: 1.4; }
.editor-body ul, .editor-body ol { margin: 0.3em 0 1em; padding-left: 1.35em; }
.editor-body ul { list-style: disc; }
.editor-body ol { list-style: decimal; }
.editor-body li { margin: 0.3em 0; }
.editor-body blockquote { margin: 1.2em 0; padding: 12px 15px; border-radius: 11px; background: var(--cream); color: var(--ink-2); }
.editor-body code { padding: 0.13em 0.4em; border-radius: 5px; background: var(--surface-soft); font-family: var(--font-mono); font-size: 0.86em; }
.editor-body pre { margin: 1.2em 0; padding: 14px 16px; overflow-x: auto; border-radius: 11px; background: #1d2434; color: #e8edf8; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.75; }
.editor-body pre code { padding: 0; background: none; color: inherit; }
.editor-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-top: 22px;
  padding-top: 15px;
  border-top: 1px solid var(--line);
}
.editor-count { color: var(--ink-3); font-family: var(--font-mono); font-size: 9px; }
.editor-actions { display: flex; align-items: center; gap: 8px; }
.editor-side {
  position: sticky;
  top: 8px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.editor-tip {
  padding: 15px 16px;
  border-radius: var(--radius-panel);
  background: rgba(255, 255, 255, 0.66);
  box-shadow: var(--shadow-soft);
}
.editor-tip h3 { color: var(--ink); font-size: 12px; font-weight: 750; }
.editor-tip p { margin-top: 6px; color: var(--ink-2); font-size: 10.5px; line-height: 1.75; }
.editor-tip .tip-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 9px; margin-top: 9px; border-top: 1px solid var(--line); color: var(--ink-3); font-family: var(--font-mono); font-size: 8.5px; }
.editor-note-card { padding: 15px 16px; border-radius: var(--radius-panel); background: var(--card-soft, var(--cream)); box-shadow: 0 2px 0 rgba(22, 31, 53, 0.05); }
.editor-note-card .en-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--card-ink-soft, var(--ink-3)); font-family: var(--font-mono); font-size: 8px; }
.editor-note-card strong { display: block; margin-top: 7px; color: var(--card-ink, var(--ink)); font-size: 13px; font-weight: 750; line-height: 1.5; }
.editor-note-card p { margin-top: 6px; color: var(--card-ink-soft, var(--ink-2)); font-size: 10px; line-height: 1.65; }


/* =========================================================
   CHAT · AI 对话
   Note-bound opening, streaming messages and per-answer source
   snapshots, inside the Memory Deck chat shell.
   ========================================================= */
.chat-page {
  display: flex;
  flex-direction: column;
  width: min(100%, 1140px);
  height: calc(100dvh - var(--topbar-h));
  margin: 0 auto;
  padding: 20px 26px 22px;
}
.chat-page-head {
  padding-bottom: 13px;
  align-items: center;
}
.chat-page-head h1 {
  font-size: 29px;
  font-weight: 800;
  letter-spacing: -0.034em;
}
.chat-page-head p { margin-top: 3px; font-size: 11.5px; }
.chat-page-head .head-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 5px;
}
.chat-page-head .head-meta .chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 21px;
  padding: 0 8px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.62);
  color: var(--ink-3);
  font-family: var(--font-mono);
  font-size: 8.5px;
}
.chat-page-head .head-meta .chip .icon { width: 10px; height: 10px; }
.chat-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 330px;
  gap: 22px;
  flex: 1;
  min-height: 0;
}
.chat-layout.is-solo { grid-template-columns: minmax(0, 1fr); max-width: 900px; width: 100%; margin: 0 auto; }
.chat-context-row {
  min-height: 50px;
  margin-bottom: 10px;
  padding: 5px 8px 5px 9px;
  background: rgba(255, 255, 255, 0.66);
  box-shadow: 0 2px 0 rgba(22, 31, 53, 0.03);
}
.chat-context-swatch {
  width: 36px;
  height: 40px;
  border-radius: 8px;
  font-size: 9px;
  transform: rotate(-2deg);
}
.chat-context-copy span { font-size: 8px; }
.chat-context-copy strong { font-size: 12.5px; }
.chat-context-copy .ctx-version {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 2px;
  color: var(--ink-3);
  font-family: var(--font-mono);
  font-size: 8px;
}
.chat-context-copy .ctx-version .icon { width: 9px; height: 9px; }
.chat-context-row .link-btn { margin-right: 5px; font-size: 10.5px; }
.chat-context-row .btn.sm { min-height: 28px; font-size: 10px; }

.chat-shell {
  border-radius: 18px;
  box-shadow: 0 3px 0 rgba(22, 31, 53, 0.06), 0 20px 42px rgba(32, 52, 91, 0.11);
}
.chat-thread { padding: 25px 28px 12px; }
.chat-messages { max-width: 720px; }
.msg { margin-bottom: 19px; }
.msg-bubble { font-size: 13.5px; line-height: 1.85; }
.msg-bubble strong { color: var(--ink); font-weight: 700; }
.msg-meta { margin-bottom: 5px; }
.msg-meta .ai-identity {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 17px;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--cream);
  color: #7a5a12;
  font-family: var(--font-mono);
  font-size: 8px;
  font-weight: 500;
}
.msg-meta .ai-identity .icon { width: 9px; height: 9px; }
.msg.user .msg-bubble { background: var(--blue); }
.msg.user .msg-meta { color: var(--ink-3); }
.msg.user .msg-meta strong { color: var(--ink-2); }
.msg-ai-avatar { margin-top: 2px; }
.streaming-caret {
  display: inline-block;
  width: 2px;
  height: 1em;
  margin-left: 2px;
  vertical-align: -2px;
  background: var(--blue);
  animation: caret 0.9s steps(1) infinite;
}
@keyframes caret { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
.msg-actions { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.retry-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 24px;
  padding: 0 9px;
  border-radius: 999px;
  background: var(--surface);
  color: var(--danger);
  font-size: 9.5px;
  font-weight: 650;
  box-shadow: 0 2px 0 rgba(22, 31, 53, 0.06);
}
.retry-btn .icon { width: 11px; height: 11px; }
.retry-btn:hover { background: var(--danger-soft); }
.answer-basis { margin-top: 11px; padding-top: 9px; border-top: 1px dashed var(--line); }
.basis-toggle {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 22px;
  color: var(--ink-3);
  font-family: var(--font-mono);
  font-size: 8.5px;
  transition: color var(--dur) var(--ease);
}
.basis-toggle:hover { color: var(--ink); }
.basis-toggle .icon { width: 10px; height: 10px; transition: transform var(--dur) var(--ease); }
.basis-toggle[aria-expanded="true"] .icon { transform: rotate(90deg); }
.basis-body {
  margin-top: 7px;
  padding: 9px 11px;
  border-radius: 9px;
  background: var(--surface-soft);
  color: var(--ink-2);
  font-size: 10.5px;
  line-height: 1.75;
}
.basis-body .basis-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 4px;
  color: var(--ink-3);
  font-family: var(--font-mono);
  font-size: 8px;
}
.related-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.related-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 23px;
  padding: 0 8px;
  border-radius: 999px;
  background: var(--surface-soft);
  color: var(--ink-2);
  font-size: 9px;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.related-chip:hover { background: var(--blue-soft); color: var(--blue-ink); }
.related-chip .icon { width: 10px; height: 10px; color: var(--coral); }
.chat-suggestions { margin: 17px auto 0; }
.chat-suggestions.compact { justify-content: center; }
.suggestion { min-height: 28px; padding: 0 10px; font-size: 10px; }
.chat-composer-wrap { padding: 11px 24px 15px; }
.chat-composer { max-width: 720px; border-color: var(--line-strong); background: var(--surface-soft); }
.chat-composer:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(38, 111, 225, 0.12); }
.chat-hint { max-width: 720px; font-size: 9px; }
.chat-hint .hint-sep { margin: 0 5px; color: var(--line-strong); }

/* ----- Start of a conversation ----------------------------------------- */
.chat-start {
  display: flex;
  flex: 1;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 0;
  padding: 26px 30px 16px;
  overflow-y: auto;
  text-align: center;
}
.chat-start-inner { width: 100%; max-width: 760px; }
.chat-start h1 {
  margin-top: 12px;
  color: var(--ink);
  font-size: 38px;
  font-weight: 800;
  line-height: 1.18;
  letter-spacing: -0.04em;
  text-wrap: balance;
}
.chat-start h1 .accent { color: var(--blue); }
.chat-start .start-sub {
  max-width: 48ch;
  margin: 10px auto 0;
  color: var(--ink-2);
  font-size: 13px;
  line-height: 1.8;
}
.chat-start .start-kicker {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 25px;
  padding: 0 10px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.72);
  color: var(--blue-ink);
  font-family: var(--font-mono);
  font-size: 8.5px;
  letter-spacing: 0.03em;
}
.chat-start .start-kicker .icon { width: 12px; height: 12px; }
.note-picker {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin-top: 22px;
  text-align: left;
}
.pick-note {
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 116px;
  padding: 13px;
  border-radius: 13px;
  background: var(--card-bg, var(--yellow));
  color: var(--card-ink, #171f35);
  box-shadow: 0 2px 0 rgba(22, 31, 53, 0.08);
  transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.pick-note:hover { transform: translateY(-3px) rotate(-0.4deg); box-shadow: 0 3px 0 rgba(22, 31, 53, 0.08), 0 12px 22px rgba(32, 52, 91, 0.13); }
.pick-note .pick-date { color: var(--card-ink-soft, rgba(23, 31, 53, 0.6)); font-family: var(--font-mono); font-size: 8px; }
.pick-note strong {
  display: -webkit-box;
  overflow: hidden;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  margin-top: 7px;
  color: var(--card-ink, #171f35);
  font-size: 11.5px;
  font-weight: 750;
  line-height: 1.45;
}
.pick-note .pick-words {
  margin-top: auto;
  padding-top: 8px;
  color: var(--card-ink-soft, rgba(23, 31, 53, 0.6));
  font-family: var(--font-mono);
  font-size: 7.5px;
}
.pick-note.pick-none {
  background: rgba(255, 255, 255, 0.42);
  border: 1.5px dashed var(--line-strong);
  box-shadow: none;
  color: var(--ink-2);
  align-items: flex-start;
  justify-content: center;
}
.pick-note.pick-none:hover { border-color: var(--blue); background: rgba(255, 255, 255, 0.7); }
.pick-note.pick-none strong { font-size: 11px; color: var(--ink-2); }
.pick-note.pick-none .pick-words { color: var(--ink-3); }
.chat-start-form { margin-top: 20px; text-align: left; }
.chat-start-form .chat-composer {
  max-width: none;
  padding: 8px 8px 8px 16px;
  border-radius: 18px;
  background: var(--surface);
  border-color: var(--line-strong);
  box-shadow: 0 3px 0 rgba(22, 31, 53, 0.05), 0 12px 26px rgba(32, 52, 91, 0.08);
}
.chat-start-form .chat-composer textarea { min-height: 30px; padding: 10px 0 6px; font-size: 13.5px; }
.chat-start-form .send-btn { width: 38px; height: 38px; }
.chat-start-hint {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  margin-top: 9px;
  color: var(--ink-3);
  font-size: 9px;
}
.chat-start-hint .mono { font-size: 8.5px; }
.chat-start .chat-suggestions { justify-content: center; margin-top: 15px; }

/* ----- Note-bound opening ---------------------------------------------- */
.chat-opening { max-width: 760px; margin: 0 auto; padding: 6px 0 4px; }
.source-card {
  position: relative;
  padding: 16px 18px 15px;
  border-radius: 14px;
  background: var(--card-soft, var(--surface-soft));
  color: var(--card-ink, var(--ink));
  box-shadow: 0 2px 0 rgba(22, 31, 53, 0.05);
  overflow: hidden;
}
.source-card::after {
  content: "";
  position: absolute;
  right: -28px;
  bottom: -34px;
  width: 110px;
  height: 110px;
  border: 1px solid var(--card-line, rgba(23, 31, 53, 0.12));
  border-radius: 50%;
  pointer-events: none;
}
.source-card-top { display: flex; align-items: flex-start; gap: 10px; }
.source-swatch {
  display: grid;
  place-items: center;
  width: 34px;
  height: 37px;
  flex: none;
  border-radius: 8px;
  background: var(--card-bg, var(--yellow));
  color: var(--card-ink, #171f35);
  font-family: var(--font-mono);
  font-size: 8.5px;
  box-shadow: 0 2px 0 rgba(22, 31, 53, 0.1);
  transform: rotate(-2deg);
}
.source-copy { min-width: 0; flex: 1; }
.source-copy .source-eyebrow { color: var(--card-ink-soft, var(--ink-3)); font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.02em; }
.source-copy h2 { margin-top: 3px; color: var(--card-ink, var(--ink)); font-size: 17px; font-weight: 800; line-height: 1.4; letter-spacing: -0.02em; }
.source-copy .source-date { margin-top: 3px; color: var(--card-ink-soft, var(--ink-3)); font-family: var(--font-mono); font-size: 8.5px; }
.source-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex: none;
  min-height: 25px;
  padding: 0 9px;
  border-radius: 999px;

  font-weight: 600;
}
.source-link:hover { background: rgba(255, 255, 255, 0.8); color: var(--card-ink, var(--ink)); }
.source-link .icon { width: 11px; height: 11px; }
.source-excerpt {
  position: relative;
  margin-top: 12px;
  padding-top: 11px;

}
.source-excerpt.is-clamped {

}
.source-more {

  margin-top: 7px;
  color: var(--card-ink-soft, var(--blue-ink));

  font-weight: 600;
}
.source-more .icon { width: 10px; height: 10px; }
.opening-ai {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  margin-top: 18px;
  padding: 17px 18px;
  border-radius: 16px;
  border-top-left-radius: 5px;
  background: var(--surface);
  box-shadow: 0 3px 0 rgba(22, 31, 53, 0.05), 0 12px 26px rgba(32, 52, 91, 0.08);
}
.opening-ai .lumi { width: 32px; height: 32px; }
.opening-ai-copy { min-width: 0; }
.opening-ai-label {
  display: flex;
  align-items: baseline;
  gap: 7px;
  color: var(--ink);
  font-size: 10.5px;
  font-weight: 750;
}
.opening-ai-label span { color: var(--ink-3); font-family: var(--font-mono); font-size: 8px; font-weight: 400; }
.opening-question {
  margin-top: 7px;
  color: var(--ink);
  font-size: 16.5px;
  font-weight: 650;
  line-height: 1.65;
  letter-spacing: -0.012em;
}
.opening-note { margin-top: 5px; color: var(--ink-2); font-size: 11.5px; line-height: 1.8; }
.opening-evidence {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-top: 10px;
  min-height: 21px;
  padding: 0 8px;
  border-radius: 999px;
  background: var(--surface-soft);
  color: var(--ink-3);
  font-family: var(--font-mono);
  font-size: 8px;
}
.opening-evidence .icon { width: 10px; height: 10px; }
.chat-opening .chat-start-form { margin-top: 18px; }

/* Chat with a bound note: the aside keeps the layout calm. */
.chat-page .related-panel { max-height: calc(100dvh - var(--topbar-h) - 120px); overflow-y: auto; }
.chat-history-empty { padding: 12px 8px; color: var(--ink-3); font-size: 10.5px; line-height: 1.7; }


/* =========================================================
   INSPIRATION · 灵感
   A single research result on a paper stage, history rail on the
   right. The split keeps the Memory Deck "stage" feel while the
   content stays a real reading surface.
   ========================================================= */
.inspiration-page { padding-top: 30px; }
.insp-head { align-items: flex-end; }
.insp-head .page-sub { max-width: 60ch; }
.insp-disclosure {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px 10px;
  margin-top: 11px;
  color: var(--ink-3);
  font-size: 10px;
  line-height: 1.6;
}
.insp-disclosure .icon { width: 12px; height: 12px; }
.insp-disclosure .discovery-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 22px;
  padding: 0 8px;
  border-radius: 999px;
  background: var(--mint-soft);
  color: #1f6b52;
  font-family: var(--font-mono);
  font-size: 8px;
  font-weight: 500;
}
.insp-disclosure .discovery-pill.is-off { background: var(--surface-soft); color: var(--ink-3); }
[data-theme="dark"] .insp-disclosure .discovery-pill { background: rgba(139, 227, 196, 0.16); color: #9fe6cd; }
.insp-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 316px;
  gap: 24px;
  align-items: start;
  margin-top: 22px;
}
.insp-stage {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 28px 30px 24px;
  border-radius: var(--radius-sheet);
  background: var(--surface);
  box-shadow: var(--shadow-sheet);
}
.insp-stage-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 22px;
}
.insp-stage-kicker {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--ink-3);
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.02em;
}
.insp-stage-kicker .icon { width: 12px; height: 12px; color: var(--coral); }
.status-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 23px;
  padding: 0 9px;
  border-radius: 999px;
  background: var(--blue-soft);
  color: var(--blue-ink);
  font-size: 9px;
  font-weight: 650;
}
.status-chip.is-saved { background: var(--cream); color: #7a5a12; }
.status-chip.is-dim { background: var(--surface-soft); color: var(--ink-3); }
.status-chip .icon { width: 11px; height: 11px; }
.insp-headline {
  margin-top: 12px;
  color: var(--ink);
  font-size: 29px;
  font-weight: 800;
  line-height: 1.4;
  letter-spacing: -0.028em;
  text-wrap: balance;
}
.insp-date {
  color: var(--ink-3);
  font-family: var(--font-mono);
  font-size: 9px;
}
.insp-brief {
  margin-top: 16px;
  color: var(--ink);
  font-size: 14px;
  line-height: 1.95;
  text-wrap: pretty;
}
.insp-brief p { margin: 0 0 0.95em; }
.insp-brief p:last-child { margin-bottom: 0; }
.cite {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  margin-left: 2px;
  border-radius: 999px;
  background: var(--blue-soft);
  color: var(--blue-ink);
  font-family: var(--font-mono);
  font-size: 7.5px;
  font-weight: 600;
  vertical-align: 2px;
}
.insp-divider { height: 1px; margin: 22px 0 0; border: 0; background: var(--line); }
.insp-section { margin-top: 20px; }
.insp-section h3 {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--ink);
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.01em;
}
.insp-section h3 .icon { width: 13px; height: 13px; color: var(--ink-3); }
.insp-section p { margin-top: 8px; color: var(--ink-2); font-size: 12.5px; line-height: 1.9; }
.insp-why {
  padding: 15px 17px;
  border-radius: 13px;
  background: var(--cream);
}
.insp-why h3 { color: #6d4f0d; }
.insp-why p { color: #5a4310; }
.insp-why .why-source { display: block; margin-top: 8px; color: #7a5a12; font-family: var(--font-mono); font-size: 8px; }
.insp-next {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  padding: 15px 17px;
  border-radius: 13px;
  background: var(--blue-soft);
}
.insp-next .lumi { width: 30px; height: 30px; margin-top: 1px; }
.insp-next-label {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--blue-ink);
  font-size: 10px;
  font-weight: 700;
}
.insp-next-label .icon { width: 12px; height: 12px; }
.insp-next p { margin-top: 5px; color: #23385c; font-size: 13px; font-weight: 550; line-height: 1.75; }
[data-theme="dark"] .insp-next { background: rgba(59, 125, 240, 0.16); }
[data-theme="dark"] .insp-next p { color: var(--ink); }
[data-theme="dark"] .insp-next-label { color: #9cc0ff; }

.insp-sources { margin-top: 24px; }
.insp-sources h3 { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; color: var(--ink); font-size: 13px; font-weight: 750; }
.insp-sources h3 span { color: var(--ink-3); font-family: var(--font-mono); font-size: 8.5px; font-weight: 400; }
.source-list { margin-top: 10px; }
.source-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 0;
  border-top: 1px solid var(--line);
}
.source-item:first-child { border-top: 0; padding-top: 4px; }
.source-index {
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  flex: none;
  margin-top: 1px;
  border-radius: 6px;
  background: var(--surface-soft);
  color: var(--ink-2);
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
}
.source-body { min-width: 0; }
.source-body a { color: var(--ink); font-size: 12px; font-weight: 650; line-height: 1.55; }
.source-body a:hover { color: var(--blue-ink); }
.source-meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px 8px;
  margin-top: 3px;
  color: var(--ink-3);
  font-family: var(--font-mono);
  font-size: 8px;
}
.source-meta .source-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--line-strong); }
.source-quote { margin-top: 5px; color: var(--ink-2); font-size: 10.5px; line-height: 1.75; }
.source-quote.is-clamped { display: -webkit-box; overflow: hidden; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.source-toggle { display: inline-flex; align-items: center; gap: 3px; margin-top: 4px; color: var(--ink-3); font-size: 8.5px; }
.source-toggle:hover { color: var(--ink); }
.source-toggle .icon { width: 9px; height: 9px; }
.insp-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 22px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
}
.insp-actions .spacer { flex: 1; }
.insp-actions .btn { min-height: 34px; font-size: 11px; }
.insp-actions .btn.is-saved { background: var(--cream); color: #7a5a12; box-shadow: 0 3px 0 rgba(122, 90, 18, 0.12); }
.insp-actions .btn.is-saved .icon { fill: currentColor; }
.insp-foot { margin-top: 14px; color: var(--ink-3); font-size: 9px; line-height: 1.7; }

/* ----- History rail ----------------------------------------------------- */
.insp-history {
  position: sticky;
  top: 8px;
  min-width: 0;
  padding: 16px;
  border-radius: var(--radius-panel);
  background: var(--surface);
  box-shadow: var(--shadow-sheet);
}
.insp-history-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  padding: 0 3px 10px;
  border-bottom: 1px solid var(--line);
}
.insp-history-head h2 { color: var(--ink); font-size: 13.5px; font-weight: 750; }
.insp-history-head span { color: var(--ink-3); font-family: var(--font-mono); font-size: 8.5px; }
.filter-pills { display: flex; gap: 4px; margin: 11px 2px 10px; }
.filter-pill {
  min-height: 26px;
  padding: 0 9px;
  border-radius: 999px;
  color: var(--ink-3);
  font-size: 9.5px;
  font-weight: 600;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.filter-pill:hover { background: var(--surface-soft); color: var(--ink); }
.filter-pill.is-active { background: var(--surface-soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.history-list { display: flex; flex-direction: column; gap: 3px; }
.history-item {
  display: block;
  width: 100%;
  padding: 9px 9px 10px;
  border-radius: 10px;
  text-align: left;
  transition: background var(--dur) var(--ease);
}
.history-item:hover { background: var(--surface-soft); }
.history-item.is-current { background: var(--blue-soft); }
.history-item .history-top {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--ink-3);
  font-family: var(--font-mono);
  font-size: 8px;
}
.history-item .history-top .unread-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--coral); }
.history-item .history-top .hist-status { margin-left: auto; display: inline-flex; align-items: center; gap: 3px; }
.history-item .history-top .hist-status .icon { width: 9px; height: 9px; }
.history-item strong {
  display: -webkit-box;
  overflow: hidden;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  margin-top: 4px;
  color: var(--ink);
  font-size: 11px;
  font-weight: 650;
  line-height: 1.55;
}
.history-item.is-current strong { color: var(--blue-ink); }
.history-empty { padding: 16px 8px; color: var(--ink-3); font-size: 10.5px; line-height: 1.7; text-align: center; }
.discovery-card {
  margin-top: 14px;
  padding: 12px 13px;
  border-radius: 12px;
  background: var(--mint-soft);
  color: #1f6b52;
}
.discovery-card .dc-top { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700; }
.discovery-card .dc-top .icon { width: 12px; height: 12px; }
.discovery-card p { margin-top: 5px; font-size: 9.5px; line-height: 1.65; }
.discovery-card .dc-foot {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid rgba(31, 107, 82, 0.16);
  font-family: var(--font-mono);
  font-size: 7.5px;
}
.discovery-card .dc-foot .link-btn { margin-left: auto; font-size: 9px; color: #1f6b52; }
[data-theme="dark"] .discovery-card { background: rgba(139, 227, 196, 0.14); color: #a8ead4; }
[data-theme="dark"] .discovery-card .dc-foot { border-top-color: rgba(168, 234, 212, 0.18); }
[data-theme="dark"] .discovery-card .dc-foot .link-btn { color: #a8ead4; }

/* ----- States ----------------------------------------------------------- */
.insp-loading { display: flex; flex-direction: column; gap: 12px; }
.insp-loading .loading-head { display: flex; align-items: center; gap: 9px; color: var(--ink-2); font-size: 11.5px; }
.insp-loading .loading-head .lumi { width: 26px; height: 26px; animation: bob 1.4s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-3px) rotate(4deg); } }
.skeleton {
  height: 13px;
  border-radius: 6px;
  background: linear-gradient(90deg, var(--surface-soft) 25%, var(--line) 37%, var(--surface-soft) 63%);
  background-size: 400% 100%;
  animation: shimmer 1.4s ease infinite;
}
.skeleton.title { height: 30px; width: 76%; }
.skeleton.w-90 { width: 90%; }
.skeleton.w-70 { width: 70%; }
.skeleton.w-50 { width: 50%; }
.skeleton.block { height: 74px; border-radius: 12px; margin-top: 6px; }
@keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
.insp-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 340px;
  padding: 30px;
  text-align: center;
}
.insp-empty .lumi { width: 44px; height: 44px; }
.insp-empty strong { display: block; margin-top: 14px; color: var(--ink); font-size: 17px; font-weight: 750; }
.insp-empty p { max-width: 34ch; margin-top: 7px; color: var(--ink-2); font-size: 12px; line-height: 1.8; }
.insp-empty .btn { margin-top: 16px; }


/* =========================================================
   PROFILE · 个人页
   ========================================================= */
.profile-page { padding-top: 30px; }
.profile-head { padding-bottom: 22px; }
.profile-identity { gap: 20px; }
.profile-avatar {
  display: grid;
  place-items: center;
  width: 84px;
  height: 84px;
  flex: none;
  border-radius: 26px;
  background: var(--avatar-bg, var(--yellow));
  color: #171f35;
  box-shadow: 0 3px 0 rgba(22, 31, 53, 0.12), 0 15px 25px rgba(32, 52, 91, 0.12);
  transform: rotate(-3deg);
}
.profile-avatar .icon { width: 40px; height: 40px; }
.profile-avatar .avatar-initial { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; }
.profile-name { font-size: 36px; font-weight: 800; letter-spacing: -0.035em; }
.profile-signature { margin-top: 4px; font-size: 12.5px; }
.profile-email {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-top: 6px;
  color: var(--ink-3);
  font-family: var(--font-mono);
  font-size: 8.5px;
}
.profile-email .icon { width: 10px; height: 10px; }
.profile-actions { padding-top: 6px; }
.profile-actions .btn { min-height: 34px; font-size: 11px; }
.profile-stats.two { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 590px; margin-top: 20px; }
.profile-stat { position: relative; padding: 16px 20px; }
.profile-stat .stat-icon {
  position: absolute;
  top: 14px;
  right: 16px;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 9px;
  background: var(--stat-bg, var(--surface-soft));
  color: var(--ink-2);
}
.profile-stat .stat-icon .icon { width: 14px; height: 14px; }
.profile-stat strong { font-size: 29px; font-weight: 600; }
.profile-grid { grid-template-columns: minmax(0, 1fr) 330px; gap: 24px; margin-top: 24px; }
.portrait-panel {
  min-width: 0;
  padding: 21px 23px 22px;
  border-radius: var(--radius-sheet);
  background: var(--surface);
  box-shadow: var(--shadow-sheet);
}
.portrait-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.portrait-title { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
.portrait-title .icon { width: 16px; height: 16px; color: var(--coral); }
.portrait-scope { margin-top: 6px; color: var(--ink-3); font-size: 9.5px; line-height: 1.7; }
.portrait-head-actions { position: relative; display: flex; align-items: center; gap: 6px; flex: none; }
.portrait-head-actions .btn { min-height: 30px; font-size: 10.5px; }
.portrait-body { margin-top: 18px; }
.portrait-section-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
  color: var(--ink-2);
  font-size: 10.5px;
  font-weight: 650;
}
.portrait-section-label span { color: var(--ink-3); font-family: var(--font-mono); font-size: 8px; font-weight: 400; }
.skill-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1px;
  margin-top: 1px;
  overflow: hidden;
  border-radius: 11px;
  background: var(--line);
}
.skill-cell {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  min-height: 44px;
  padding: 9px 12px;
  background: var(--surface);
}
.skill-cell span { color: var(--ink-2); font-size: 11px; line-height: 1.5; }
.skill-level {
  display: inline-flex;
  align-items: center;
  min-height: 20px;
  padding: 0 7px;
  border-radius: 999px;
  background: var(--surface-soft);
  color: var(--ink-3);
  font-family: var(--font-mono);
  font-size: 7.5px;
  white-space: nowrap;
}
.skill-level.lv-3 { background: var(--mint-soft); color: #1f6b52; }
.skill-level.lv-2 { background: var(--blue-soft); color: var(--blue-ink); }
.skill-level.lv-1 { background: var(--lilac-soft); color: #5a4794; }
[data-theme="dark"] .skill-level.lv-3 { background: rgba(139, 227, 196, 0.16); color: #a8ead4; }
[data-theme="dark"] .skill-level.lv-2 { background: rgba(59, 125, 240, 0.18); color: #9cc0ff; }
[data-theme="dark"] .skill-level.lv-1 { background: rgba(201, 184, 255, 0.16); color: #cfc0ff; }
.portrait-bio { margin-top: 18px; color: var(--ink-2); font-size: 12.5px; line-height: 1.9; }
.portrait-bio p + p { margin-top: 10px; }
.portrait-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 18px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  color: var(--ink-3);
  font-family: var(--font-mono);

}

}

/* =========================================================
   PRODUCT-ALIGNED COMPOSITION OVERRIDES
   Keeps the Memory Deck surface language while following the
   shipped workspace IA: chat starts from a real note suggestion,
   inspiration history sits under the article, and the profile
   stays a single calm column.
   ========================================================= */

/* ----- Chat: real suggestion card + note-bound empty state ------ */
.care-card {
  position: relative;
  margin-top: 20px;
  padding: 17px 18px 15px;
  overflow: hidden;
  border-radius: 16px;

  position: absolute;
  right: -30px;
  bottom: -42px;
  width: 132px;
  height: 132px;

  border-radius: 50%;
  pointer-events: none;
}
.care-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

  padding: 2px 6px;
  border-radius: 999px;
  background: var(--cream);
  color: #7a5a12;
  font-family: var(--font-mono);
  font-size: 7.5px;
  font-weight: 500;
}
.care-swap {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 26px;
  padding: 0 9px;
  border-radius: 999px;
  color: var(--ink-3);
  font-size: 9.5px;
  font-weight: 600;

.care-swap .icon { width: 11px; height: 11px; }
.care-intro { margin-top: 10px; color: var(--ink); font-size: 13.5px; line-height: 1.8; }
.care-intro p + p { margin-top: 7px; }
.care-note {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: 11px;
  margin-top: 12px;
  padding: 11px 12px;
  border-radius: 12px;
  background: var(--card-soft, var(--surface-soft));
  color: var(--card-ink, var(--ink));
}
.care-swatch {
  display: grid;
  place-items: center;
  width: 34px;
  height: 37px;
  flex: none;
  border-radius: 8px;
  background: var(--card-bg, var(--yellow));

.care-hint { margin-top: 10px; color: var(--ink-3); font-size: 9px; line-height: 1.65; }

.insp-history-head h2 { font-size: 15px; }
.filter-pills { margin: 12px 0 14px; }
.history-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-items: stretch; }
.history-item { height: 100%; padding: 12px 13px; border: 1px solid var(--line); background: var(--surface); }
.history-item:hover { border-color: var(--line-strong); background: var(--surface); box-shadow: var(--shadow-soft); }
.history-item.is-current { border-color: rgba(38, 111, 225, 0.35); background: var(--blue-soft); }
.history-item strong { font-size: 11.5px; -webkit-line-clamp: 2; }
.history-item .history-top { font-size: 8px; }
.history-item .history-foot { display: flex; align-items: center; gap: 7px; margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 8.5px; }
.history-item .history-foot .pill {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  min-height: 18px;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--surface-soft);
  color: var(--ink-3);
  font-size: 7.5px;
}
.history-item .history-foot .pill .icon { width: 9px; height: 9px; }
.history-item .history-foot .restore-btn { margin-left: auto; color: var(--blue-ink); font-size: 8.5px; font-weight: 650; }
.history-empty { grid-column: 1 / -1; }
.history-more { display: flex; justify-content: center; margin-top: 16px; }
.discovery-card { margin-top: 0; }
.insp-history .discovery-card { margin-top: 16px; }
.insp-summary {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px 12px;
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: 11px;
  background: var(--surface-soft);
  color: var(--ink-2);
  font-size: 9.5px;
}
.insp-summary .summary-status { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; }
.insp-summary .summary-status .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--mint); }
.insp-summary .summary-status.is-off .dot { background: var(--line-strong); }
.insp-summary .summary-meta { color: var(--ink-3); font-family: var(--font-mono); font-size: 8px; }
.insp-summary .link-btn { margin-left: auto; font-size: 9px; }

/* ----- Profile: single column, wide portrait sheet --------------- */
.profile-page { width: min(100%, 920px); }
.portrait-panel { padding: 24px 26px 22px; }
.portrait-cols {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  gap: 26px;
  align-items: start;
  margin-top: 17px;
}
.portrait-main { min-width: 0; }
.portrait-meta { min-width: 0; padding-left: 22px; border-left: 1px solid var(--line); }
.portrait-meta .meta-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); color: var(--ink-2); font-size: 10px; }
.portrait-meta .meta-row:first-child { border-top: 0; padding-top: 0; }
.portrait-meta .meta-row .meta-value { color: var(--ink-3); font-family: var(--font-mono); font-size: 8px; text-align: right; }
.portrait-meta .meta-note { margin-top: 10px; color: var(--ink-3); font-size: 9px; line-height: 1.7; }
.portrait-meta .meta-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.portrait-meta .meta-actions .btn { min-height: 29px; font-size: 9.5px; }
.profile-lower { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr); gap: 18px; margin-top: 20px; }
.profile-lower .side-card { box-shadow: var(--shadow-soft); }
.profile-foot-note { margin-top: 18px; color: var(--ink-3); font-size: 9px; line-height: 1.7; text-align: center; }
.profile-stats.two { max-width: 100%; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.profile-stat { min-height: 76px; }
.profile-stat strong { font-size: 27px; }
.profile-stat .stat-label { display: flex; align-items: center; gap: 5px; }
.profile-stat .stat-label .icon { width: 11px; height: 11px; color: var(--ink-3); }
.profile-stat .stat-note { display: block; margin-top: 6px; color: var(--ink-3); font-size: 8.5px; }
.portrait-loading { padding: 6px 0 10px; }
.portrait-loading .loading-copy { margin-top: 12px; color: var(--ink-3); font-size: 9.5px; }

/* ----- Settings: product width (880 / 165) ------------------------ */
.modal-sheet.settings-sheet { width: min(880px, 100%); }
.settings-layout { grid-template-columns: 176px minmax(0, 1fr); min-height: 540px; }
.settings-nav { padding: 22px 13px 16px; }
.settings-main { max-height: min(660px, calc(100dvh - 80px)); }
.settings-content-head { padding: 25px 28px 0; }
.settings-body { padding: 18px 28px 24px; }

/* =========================================================
   DARK THEME
   ========================================================= */
body[data-theme="dark"] {
  --bg: #111726;
  --bg-2: #1a2234;
  --surface: #222b40;
  --surface-soft: #1a2234;
  --ink: #f1f4fc;
  --ink-2: #b9c3d9;
  --ink-3: #8b97b2;
  --line: rgba(255, 255, 255, 0.13);
  --line-strong: rgba(255, 255, 255, 0.22);
  --blue: #4d86f0;
  --blue-hover: #3d76e0;
  --blue-soft: rgba(77, 134, 240, 0.18);
  --blue-ink: #9cc0ff;
  --danger: #e07070;
  --danger-soft: rgba(224, 112, 112, 0.16);
  --cream: #3a3320;
  --mint-soft: rgba(139, 227, 196, 0.14);
  --lilac-soft: rgba(201, 184, 255, 0.15);
  --sky-soft: rgba(143, 208, 255, 0.14);
  --sidebar-bg: #171e2e;
  --topbar-bg: rgba(23, 30, 46, 0.92);
  --shadow-sheet: 0 3px 0 rgba(0, 0, 0, 0.24), 0 18px 38px rgba(0, 0, 0, 0.28);
  --shadow-soft: 0 2px 0 rgba(0, 0, 0, 0.2), 0 8px 18px rgba(0, 0, 0, 0.22);
  --shadow-lift: 0 4px 0 rgba(0, 0, 0, 0.24), 0 20px 36px rgba(0, 0, 0, 0.34);
}
body[data-theme="dark"]::before {
  background:
    radial-gradient(circle at 85% 4%, rgba(255, 128, 109, 0.12), transparent 24%),
    radial-gradient(circle at 10% 94%, rgba(38, 111, 225, 0.18), transparent 28%),
    radial-gradient(circle at 60% 40%, rgba(201, 184, 255, 0.1), transparent 32%);
}
body[data-theme="dark"] .sidebar { border-right-color: rgba(255, 255, 255, 0.1); }
body[data-theme="dark"] .topbar { border-bottom-color: rgba(255, 255, 255, 0.1); }

body[data-theme="dark"] .quick-capture { border: 1px solid rgba(255, 255, 255, 0.06); }
body[data-theme="dark"] .note-actions { background: var(--surface); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.36); }
body[data-theme="dark"] .new-note-tile { background: rgba(255, 255, 255, 0.03); }
body[data-theme="dark"] .new-note-tile:hover { background: rgba(255, 255, 255, 0.06); }
body[data-theme="dark"] .reader-ai .ai-bubble,
body[data-theme="dark"] .hero-ai .ai-bubble { background: var(--surface); }
body[data-theme="dark"] .msg.ai .msg-bubble { background: #2a3449; }
body[data-theme="dark"] .user.msg .msg-bubble { background: var(--blue); }
body[data-theme="dark"] .chat-composer { background: #1a2234; border-color: rgba(255, 255, 255, 0.18); }
body[data-theme="dark"] .editor-toolbar { background: #1a2234; }
body[data-theme="dark"] .editor-tip { background: rgba(255, 255, 255, 0.03); }
body[data-theme="dark"] .editor-body pre { background: #0e1420; }
body[data-theme="dark"] .reader-body pre { background: #0e1420; }
body[data-theme="dark"] .reader-body blockquote { color: var(--ink-2); }
body[data-theme="dark"] .side-search input { background: rgba(255, 255, 255, 0.04); }
body[data-theme="dark"] .side-note:hover,
body[data-theme="dark"] .side-note.is-current,
body[data-theme="dark"] .side-chat:hover,
body[data-theme="dark"] .side-chat.is-current { background: rgba(255, 255, 255, 0.06); }
body[data-theme="dark"] .account-btn:hover { background: rgba(255, 255, 255, 0.06); }
body[data-theme="dark"] .btn.secondary { background: var(--surface); }
body[data-theme="dark"] .btn.secondary:hover { background: #2a3449; }
body[data-theme="dark"] .btn.ghost:hover { background: rgba(255, 255, 255, 0.06); }
body[data-theme="dark"] .icon-btn:hover { background: var(--surface); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); }
body[data-theme="dark"] .settings-nav { background: #1a2234; }
body[data-theme="dark"] .settings-tab:hover { background: rgba(255, 255, 255, 0.05); }
body[data-theme="dark"] .settings-tab.is-active { background: var(--surface); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); }
body[data-theme="dark"] .source-card { border: 1px solid rgba(255, 255, 255, 0.05); }
body[data-theme="dark"] .care-card { border: 1px solid rgba(255, 255, 255, 0.05); }

body[data-theme="dark"] .lumi path { stroke: #171f35; }

/* Memory cards keep pastel paper; the "white" theme becomes a dark sheet. */
body[data-theme="dark"] .card-arrow { background: rgba(23, 31, 53, 0.1); }
body[data-theme="dark"] .card-tag { background: rgba(255, 255, 255, 0.45); }

body[data-theme="dark"] .spotlight-open { background: rgba(23, 31, 53, 0.1); }
body[data-theme="dark"] .related-item { box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18); }

/* =========================================================

body[data-motion="reduce"] *,
body[data-motion="reduce"] *::before,
body[data-motion="reduce"] *::after {
  animation-duration: 0.01ms !important;
  animation-iteration-count: 1 !important;
  transition-duration: 0.01ms !important;
  scroll-behavior: auto !important;
}
body[data-fontsize="small"] { --reading-size: 15px; }

body[data-fontsize="large"] { --reading-size: 18px; }

/* =========================================================
   COMPONENT COMPLETIONS + CONTRAST FIXES
   ========================================================= */
.note-main {
  display: block;
  flex: 1;
  min-width: 0;
  padding-right: 108px;
  color: inherit;
  text-decoration: none;
}
.note-main:focus-visible { outline: none; }
.note-row:focus-within { box-shadow: var(--shadow-lift); }
.section-meta { font-family: var(--font-mono); font-size: 9.5px; }
.load-more .section-meta { color: var(--ink-3); }

/* History items are divs (they can contain the restore button). */
.history-item {
  display: block;
  width: 100%;
  cursor: pointer;
  color: inherit;
  font: inherit;
  text-align: left;
}
.history-item:focus-visible { outline-offset: 2px; }
.restore-btn {
  color: var(--blue-ink);
  font-size: 8.5px;
  font-weight: 650;
  text-decoration: underline;
  text-underline-offset: 2px;
}
.restore-btn:hover { color: var(--ink); }

/* AI title suggestion row */
.ai-title-suggestion { margin-top: 8px; }
.ai-title-suggestion-inner {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px 10px;
  padding: 9px 11px;
  border-radius: 10px;
  background: var(--cream);
  color: #5a4310;
}
.suggestion-label {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: #7a5a12;
  font-size: 9px;
  font-weight: 650;
}
.suggestion-label .icon { width: 11px; height: 11px; }
.ai-title-suggestion-inner strong { flex: 1; min-width: 140px; color: #4e3a09; font-size: 11.5px; font-weight: 700; line-height: 1.5; }
.suggestion-actions { display: flex; align-items: center; gap: 5px; margin-left: auto; }
.ai-title-suggestion-inner.is-applied { background: var(--mint-soft); color: #1f6b52; }
.ai-title-suggestion-inner.is-applied .suggestion-label { color: #1f6b52; }

/* Task lists in reading and editing */
.reader-body ul.task-list, .editor-body ul.task-list { padding-left: 0.1em; list-style: none; }
.reader-body .task-list li, .editor-body .task-list li { display: flex; align-items: flex-start; gap: 8px; padding-left: 0; }
.reader-body .task-list li::marker, .editor-body .task-list li::marker { content: ""; }
.task-list input[type="checkbox"] { width: 14px; height: 14px; margin-top: 6px; accent-color: var(--blue); }

/* Related note buttons are redundant when the side panel is visible. */
@media (min-width: 1241px) {
  .chat-related-open { display: none; }
}

/* Sidebar collapsed: keep the expand control in flow. */
body.sidebar-collapsed .side-collapse {
  position: static;
  width: 30px;
  margin: 10px auto 0;
  transform: none;
  background: rgba(255, 255, 255, 0.55);
}
body.sidebar-collapsed .side-collapse .icon { display: block; width: 17px; height: 17px; }
body.sidebar-collapsed .side-new { margin-top: 14px; }
body.sidebar-collapsed .side-new .icon { width: 17px; height: 17px; }

/* Dark-mode paper-safe pills */
body[data-theme="dark"] .source-link,
body[data-theme="dark"] .spotlight-open { background: color-mix(in srgb, var(--surface) 70%, transparent); }
body[data-theme="dark"] .chat-context-row { background: rgba(255, 255, 255, 0.06); }
body[data-theme="dark"] .chat-context-swatch { color: var(--card-ink, #171f35); }
body[data-theme="dark"] .msg-meta .ai-identity { background: rgba(255, 212, 94, 0.16); color: #f0cf8a; }
body[data-theme="dark"] .editor-status.is-dirty,
body[data-theme="dark"] .status-chip.is-saved,
body[data-theme="dark"] .btn.is-saved,
body[data-theme="dark"] .care-label small,
body[data-theme="dark"] .insp-why,
body[data-theme="dark"] .ai-title-suggestion-inner {
  background: rgba(255, 212, 94, 0.14);
  color: #f0cf8a;
}
body[data-theme="dark"] .insp-why h3,
body[data-theme="dark"] .insp-why p,
body[data-theme="dark"] .insp-why .why-source,
body[data-theme="dark"] .ai-title-suggestion-inner strong,
body[data-theme="dark"] .editor-status.is-dirty,
body[data-theme="dark"] .status-chip.is-saved,
body[data-theme="dark"] .btn.is-saved,
body[data-theme="dark"] .care-label small { color: #f0cf8a; }
body[data-theme="dark"] .ai-title-suggestion-inner .suggestion-label { color: #f0cf8a; }
body[data-theme="dark"] .ai-title-suggestion-inner.is-applied { background: rgba(139, 227, 196, 0.14); color: #a8ead4; }
body[data-theme="dark"] .ai-title-suggestion-inner.is-applied .suggestion-label { color: #a8ead4; }
body[data-theme="dark"] .field input,
body[data-theme="dark"] .field textarea { border-color: rgba(255, 255, 255, 0.24); }
body[data-theme="dark"] .profile-email { color: var(--ink-3); }
body[data-theme="dark"] .btn.danger { color: #fff; }

/* Danger uses a dedicated solid background so text/error colors stay legible. */
:root { --danger-solid: #c34444; }
body[data-theme="dark"] { --danger: #ff9b9b; --danger-solid: #b84f4f; }
.btn.danger { background: var(--danger-solid); }
.btn.danger:hover { background: color-mix(in srgb, var(--danger-solid) 86%, #000); }
body[data-theme="dark"] .btn.danger:hover { background: color-mix(in srgb, var(--danger-solid) 88%, #fff); }

/* The reading column can sit next to a coloured sheet in dark mode. */
body[data-theme="dark"] .reader-stack::before { opacity: 0.76; }
body[data-theme="dark"] .reader-stack::after { opacity: 0.22; }
body[data-theme="dark"] .capture-stack::before { opacity: 0.34; }
body[data-theme="dark"] .capture-stack::after { opacity: 0.18; }
body[data-theme="dark"] .spotlight::after { border-color: rgba(255, 255, 255, 0.16); }
body[data-theme="dark"] .spotlight::before { background: rgba(255, 255, 255, 0.24); }
body[data-theme="dark"] .reader-tab { box-shadow: 0 3px 0 rgba(0, 0, 0, 0.26); }
body[data-theme="dark"] .source-card::after { border-color: rgba(255, 255, 255, 0.16); }
body[data-theme="dark"] .discovery-note.is-off { color: var(--ink-2); }

/* A little more room for the real 1280/1024 layouts. */
@media (max-width: 1280px) {
  .page { padding-left: 24px; padding-right: 24px; }
  .chat-page { padding-left: 20px; padding-right: 20px; }
  .reader-card { padding: 30px 30px 24px; }
  .insp-stage { padding: 24px 26px 22px; }
}
@media (max-width: 1100px) {
  .hero-deck { display: none; }
  .spotlight { min-height: 190px; }
  .profile-lower { grid-template-columns: 1fr; }
  .insp-history { padding: 16px; }
}

/* Dark theme: translucent white chips would disappear on dark surfaces. */
body[data-theme="dark"] .kicker,
body[data-theme="dark"] .chat-start .start-kicker,
body[data-theme="dark"] .chat-page-head .head-meta .chip,
body[data-theme="dark"] .hero-kicker {
  background: rgba(255, 255, 255, 0.07);
  color: var(--blue-ink);
}
body[data-theme="dark"] .capture-stack::before { opacity: 0.12; }
body[data-theme="dark"] .capture-stack::after { opacity: 0.12; }

/* Keep row actions on one line. */
.side-row .row-action,
.source-link,
.spotlight-open,
.btn,
.kicker { white-space: nowrap; }

/* Dark primary buttons keep white text at >=4.5:1. */
body[data-theme="dark"] { --blue: #2f6fd8; --blue-hover: #2760c4; }

/* Reading actions sit on the title line, like the shipped workspace. */
.reading-topline { flex-wrap: wrap; gap: 10px 12px; }
.reading-tools { flex-wrap: wrap; gap: 6px; }
.reading-tools .btn { min-height: 31px; font-size: 10.5px; }
.reading-tools .btn .icon { width: 13px; height: 13px; }
.reader-tab { font-size: 8.5px; }

/* Dark blockquote reads as a warm note, not a muddy panel. */
body[data-theme="dark"] .reader-body blockquote { background: rgba(255, 212, 94, 0.1); color: var(--ink-2); }
body[data-theme="dark"] .reader-body blockquote strong { color: var(--ink); }

/* Keep the account rows on one line on narrower desktops. */
.side-row .row-value { max-width: 62%; }

/* Notes empty state */
.notes-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 52px 20px 44px;
  text-align: center;
}
.notes-empty .lumi { width: 46px; height: 46px; }
.notes-empty strong { margin-top: 14px; font-size: 18px; }
.notes-empty p { max-width: 34ch; margin-top: 6px; font-size: 12px; }
.notes-empty .btn { margin-top: 16px; }

@media (max-width: 900px) {
  .notes-hero { grid-template-columns: 1fr; }
  .spotlight { min-height: 190px; }
}

/* Demo sources open a local preview instead of a dead external link. */
.source-title-link {
  display: inline;
  padding: 0;
  border: 0;
  background: none;
  color: var(--ink);
  font: inherit;
  font-size: 12px;
  font-weight: 650;
  line-height: 1.55;
  text-align: left;
  cursor: pointer;
}
.source-title-link:hover { color: var(--blue-ink); text-decoration: underline; text-underline-offset: 3px; }
.source-preview p { color: var(--ink-2); font-size: 12.5px; line-height: 1.9; }

</style>

  {
    id: "n9",
    title: "",

    updatedAt: "2026-10-27T19:36:00+08:00",
    revision: 1,
    tone: 1,
    html: "<p>今天下班路上没有戴耳机。走到路口，才发现那家面包店换了一块很小的招牌，木头的，边角磨得发亮。</p><p>再往前走，便利店门口有人在拆一箱牛奶。纸箱打开的声音很轻，像是一天里最后一点被允许的慢。</p><p>我没有停下来拍照，只是在备忘录里写下了这两句。</p>",

  {
    id: "n8",
    title: "重复听同一首歌",
    createdAt: "2026-10-26T22:14:00+08:00",
    updatedAt: "2026-10-26T22:14:00+08:00",
    revision: 1,
    tone: 0,
    html: "<p>今天单曲循环了很久一首旧歌。明明旋律已经熟到不需要听，还是在同一个地方停下来。</p><p>也许重复并不是停滞，是身体在替记忆留一个位置。我没有把这首歌写进任何歌单。它只是和某一段路、某一个人、某一种天气待在一起，像一枚被反复触摸的按钮。</p><p>第十遍的时候，我突然听见第二遍没有出现的和声。所谓熟悉，可能只是第一次听得太用力。</p>",
    related: [
      { id: "n7", strength: "相关", reason: "都在追问「为什么反复回到同一个地方」。" },
      { id: "n3", strength: "可能相关", reason: "重复与不急着下结论，是同一种耐心。" }
    ]
  },
  {
    id: "n7",
    title: "关于「慢思考」的一点笔记",
    createdAt: "2026-10-26T09:12:00+08:00",
    updatedAt: "2026-10-27T08:40:00+08:00",
    revision: 5,
    tone: 2,
    html: "<p>快思考的产物是可以被复述的，慢思考的产物是被重新看见的。这两者的区别不在速度上，而在于有没有留下「当时为什么这么想」的痕迹。</p><h2>我想试着改的三件小事</h2><ul><li>先记下犹豫的地方，再决定要不要下结论。</li><li>每段记录后面补一句「它可能错在哪里」。</li><li>隔一天再回来读，只补一句话，不重写全文。</li></ul><blockquote><p>记录不是把生活归档，而是给以后再想一想的自己留一条可以回来的路。</p></blockquote><p>我怀疑大部分人所谓的记笔记，只是想要一个可以反复确认「我当时到底对不对」的地方。也许真正值得留下的，不是结论，而是那个让人犹豫了一下的地方。</p><p>今天补记：上面第三条比前两条更有用。重读时只补一句，反而更容易看见当时没有说完的部分。</p>",
    related: [
      { id: "n4", strength: "高度相关", reason: "两篇都在给注意力留一块没有被占用的地方。" },
      { id: "n6", strength: "相关", reason: "把工具当成窗口，而不是功能清单。" },
      { id: "n2", strength: "可能相关", reason: "都在讨论「看见」发生之前的条件。" }
    ]
  },
  {
    id: "n6",
    title: "好的工具，让人忘记工具本身",
    createdAt: "2026-10-25T18:46:00+08:00",
    updatedAt: "2026-10-25T18:46:00+08:00",
    revision: 1,
    tone: 5,
    html: "<p>今天重新整理了自己的工作台，把用不到的东西都收起来了。屏幕空下来以后，反而更容易专注。好的产品不一定要让人感到「功能很多」，而是让人自然地完成想做的事。设计的最后一步，也许是把设计本身藏起来。</p><table><thead><tr><th>看起来在帮忙</th><th>实际上在提醒我</th></tr></thead><tbody><tr><td>常驻入口</td><td>我还有事情没做完</td></tr><tr><td>实时统计</td><td>今天产出还不够</td></tr><tr><td>消息红点</td><td>你该回应别人了</td></tr></tbody></table><p>但这不等于没有存在感。它更像一扇开得正好的窗：你不会一直盯着窗框，却知道光从哪里进来。</p>",
    related: [
      { id: "n4", strength: "相关", reason: "安静的工具，和散步一样，都是给注意力让路。" },
      { id: "n7", strength: "可能相关", reason: "都在讨论留白如何影响思考。" }
    ]
  },
  {
    id: "n5",
    title: "城市在凌晨三点有两种声音",
    createdAt: "2026-10-24T03:12:00+08:00",
    updatedAt: "2026-10-24T03:12:00+08:00",
    revision: 2,
    tone: 3,
    html: "<p>一种是从未停过的：环卫车倒车的提示音、地下车库的通风口、24 小时便利店被反复推开的门轴。</p><p>另一种是刚刚醒来的：早班公交的第一声气刹、面包房后厨的揉面声、地铁隧道深处那阵越来越近的震动。我一直以为凌晨是安静的，后来才发现，安静只是白天听不见。</p><p>如果把城市当成一个一直在说话的有机体，那么凌晨三点不是它最安静的时候，而是它换了一种语速。</p>",
    related: [
      { id: "n1", strength: "相关", reason: "听见城市，也是在重新学习「听见自己」。" }
    ]
  },
  {
    id: "n4",
    title: "散步的时候，想法才慢慢出现",
    createdAt: "2026-10-22T20:35:00+08:00",
    updatedAt: "2026-10-22T20:35:00+08:00",
    revision: 1,
    tone: 4,
    html: "<p>傍晚沿着河边走了二十分钟，没有听播客，也没有看手机。一个卡了很久的问题，突然有了新的方向。</p><p>也许思考不总是发生在坐下来、打开文档的时候。身体先动起来，语言才有机会从别的地方跟上来。</p><p>记下来的时候不要急着总结。先记住当时的光线、鞋底和风的方向，结论可以晚一点到。</p>",
    related: [
      { id: "n7", strength: "高度相关", reason: "注意力不是被夺走的，而是需要一块没有被占用的地面。" },
      { id: "n6", strength: "相关", reason: "安静的环境让想法先出现，工具只负责不挡住它。" },
      { id: "n3", strength: "可能相关", reason: "两篇都主张先别急着给结论。" }
    ]
  },
  {
    id: "n3",
    title: "不必急着给每个想法一个结论",
    createdAt: "2026-10-20T22:02:00+08:00",
    updatedAt: "2026-10-20T22:02:00+08:00",
    revision: 1,
    tone: 0,
    html: "<p>有些想法在出现的时候只是一个动作，还不是一句话。如果太快地把它写成结论，它就会失去继续生长的能力。</p><p>所以最近给自己的规则是：先记下它出现时的样子，不急着替它找意义。</p><p>过几天回来，它可能会自己长出新的句子。也可能什么都不会发生，那也没有关系。</p>",
    related: [
      { id: "n8", strength: "可能相关", reason: "重复与搁置，都是给想法保留继续生长的空间。" }
    ]
  },
  {
    id: "n2",
    title: "把晚霞写下来",
    createdAt: "2026-10-18T18:31:00+08:00",
    updatedAt: "2026-10-18T18:31:00+08:00",
    revision: 1,
    tone: 1,
    html: "<p>今天下班的时候天很红，红得有点不真实。走到路口，几乎所有人都停下来拍照，然后继续过马路。</p><p>我什么也没拍，只在备忘录里写了一句：晚霞把楼的边缘烧成了金色。写下来以后，它好像才真的发生过。</p>",
    related: [
      { id: "n5", strength: "可能相关", reason: "都是关于「看见」和「记录下来」之间的时间差。" }
    ]
  },
  {
    id: "n1",
    title: "被重新看见之后",
    createdAt: "2026-10-15T23:40:00+08:00",
    updatedAt: "2026-10-15T23:40:00+08:00",
    revision: 1,
    tone: 2,
    html: "<p>重读旧笔记的时候，我会先看当时的字迹，再看当时写了什么。字迹里有一种现在已经不太熟悉的用力。</p><p>那时候的我想证明什么，现在的我只想知道他在害怕什么。</p><p>所谓理解过去，也许不是替它找到一个更好的说法，而是承认它当时只能那样说。</p>",
    related: [
      { id: "n5", strength: "相关", reason: "凌晨的声音与旧笔记，都需要换一个位置才被听见。" }
    ]
  },
  {
    id: "n10",
    title: "站在便利店门口的二十分钟",
    createdAt: "2026-10-12T22:18:00+08:00",
    updatedAt: "2026-10-12T22:18:00+08:00",
    revision: 1,
    tone: 3,
    html: "<p>加完班在便利店门口站了二十分钟。玻璃门一会儿开一会儿合，冷气漏出来，和外面的闷热撞在一起。</p><p>我本来只是想等雨小一点，后来发现自己在看货架上的饭团被一个个买走。城市里有很多这样的微小循环，没有人负责记住它们。</p>",
    related: [
      { id: "n5", strength: "相关", reason: "同一个凌晨，不同的声音和光线。" }
    ]
  },
  {
    id: "n11",
    title: "关于三分钟热度",
    createdAt: "2026-10-08T21:05:00+08:00",
    updatedAt: "2026-10-08T21:05:00+08:00",
    revision: 1,
    tone: 5,
    html: "<p>三分钟热度也许不是缺点，而是身体在快速确认「这件事值不值得继续」。问题不是热度太短，而是我没有给短热度留下可以接力的地方。</p><p>最近换了个做法：每次只要求自己留下一个可以回来的句子。至于要不要继续，下次回来再说。</p>",
    related: [
      { id: "n3", strength: "相关", reason: "不急着下结论，也是一种保存热度的方法。" }
    ]
  },
  {
    id: "n12",
    title: "把周末空出来以后",
    createdAt: "2026-09-28T10:22:00+08:00",
    updatedAt: "2026-09-28T10:22:00+08:00",
    revision: 1,
    tone: 4,
    html: "<p>这个周末没有安排任何事。第一天很不习惯，总觉得应该出门做点什么。第二天开始，时间变得很慢，慢到可以听见楼下修车的声音。</p><p>空出来的时间并不会自动变成休息。它先是变成焦虑，然后才慢慢变成别的东西。</p>",
    related: [
      { id: "n4", strength: "可能相关", reason: "空白与散步，都在为没有产出的时间留位置。" }
    ]
  }
];
