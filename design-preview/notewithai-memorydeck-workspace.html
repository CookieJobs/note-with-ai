const $ = (selector, root = document) => root.querySelector(selector);
const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));
const NOW = new Date();
const PREF_KEY = "nwai.memorydeck.preview.v1";
const NEW_DRAFT_KEY = "nwai.memorydeck.new-draft.v1";
const pad2 = (value) => String(value).padStart(2, "0");
const WEEKDAYS = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
const dateShort = (iso) => {
  const d = new Date(iso);
  return `${pad2(d.getMonth() + 1)}.${pad2(d.getDate())}`;
};
const dateSlash = (iso) => {
  const d = new Date(iso);
  return `${d.getFullYear()}/${pad2(d.getMonth() + 1)}/${pad2(d.getDate())}`;
};
const dateClock = (iso) => {
  const d = new Date(iso);
  return `${dateSlash(iso)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
};
const dateCN = (iso) => {
  const d = new Date(iso);
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
};
const timeHM = (iso) => {
  const d = new Date(iso);
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
};
const weekdayCN = (iso) => WEEKDAYS[new Date(iso).getDay()];
const todayLong = () => `${NOW.getMonth() + 1}月${NOW.getDate()}日${WEEKDAYS[NOW.getDay()]}`;
const localTimeText = (iso) => `${dateSlash(iso)} ${timeHM(iso)}`;
const deepClone = (value) => JSON.parse(JSON.stringify(value));
const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

function esc(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}
function icon(name, cls = "") {
  return `<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
}
function lumi(cls = "") {
  return `<svg class="lumi ${cls}" viewBox="0 0 48 48" aria-hidden="true">
    <path d="M24 4.5l4.9 13.4 14.1 5.3-13.7 5.9L24 43.5l-5.3-14.4L5 23.2l14.1-5.3z" fill="#FFD45E" stroke="#171F35" stroke-width="2.4" stroke-linejoin="round"></path>
    <circle cx="19.2" cy="22.5" r="2" fill="#171F35"></circle>
    <circle cx="28.8" cy="22.5" r="2" fill="#171F35"></circle>
    <path d="M20 29c2.3 2.2 5.7 2.2 8 0" fill="none" stroke="#171F35" stroke-width="2" stroke-linecap="round"></path>
  </svg>`;
}
function stripHtml(html) {
  const node = document.createElement("div");
  node.innerHTML = String(html || "");
  return (node.textContent || "").replace(/\s+/g, " ").trim();
}
function truncate(text, max) {
  const value = String(text || "");
  return Array.from(value).length > max ? `${Array.from(value).slice(0, max).join("")}…` : value;
}
function firstSentence(text, max = 30) {
  const value = String(text || "").split(/[。！？!?\n]/)[0].trim();
  return truncate(value || String(text || ""), max);
}
function noteText(note) {
  return note ? stripHtml(note.html) : "";
}
function noteDisplayTitle(note) {
  if (!note) return "未命名笔记";
  if (note.title && note.title.trim()) return note.title.trim();
  return firstSentence(noteText(note), 26) || "未命名笔记";
}
function noteExcerpt(note, max = 110) {
  return truncate(noteText(note), max);
}
function cardTone(note) {
  const base = CARD_TONES[Math.abs(note.tone || 0) % CARD_TONES.length];
  if (resolvedTheme() === "dark" && base.name === "paper") {
    return { name: "paper-dark", bg: "#293247", soft: "rgba(255,255,255,.06)", ink: "#f1f4fc", inkSoft: "rgba(241,244,252,.72)", line: "rgba(255,255,255,.16)" };
  }
  return base;
}
function cardVars(note) {
  const tone = cardTone(note);
  return `--card-bg:${tone.bg};--card-soft:${tone.soft};--card-ink:${tone.ink};--card-ink-soft:${tone.inkSoft};--card-line:${tone.line}`;
}
function avatarPreset(id) {
  return AVATAR_PRESETS.find((item) => item.id === id) || AVATAR_PRESETS[0];
}
function avatarInner(preset, name) {
  if (preset.icon) return icon(preset.icon);
  return `<span class="avatar-initial">${esc((name || "林").slice(0, 1))}</span>`;
}
function avatarStyle(preset) {
  return `--avatar-bg:${preset.bg}`;
}
/* Markdown-lite: enough for answers and preview copy, always escaped first. */
function mdLite(text) {
  const blocks = String(text || "").split(/\n{2,}/).map((part) => part.trim()).filter(Boolean);
  return blocks.map((block) => {
    const lines = block.split("\n");
    let html = "";
    let paragraph = [];
    let list = [];
    const flushParagraph = () => {
      if (!paragraph.length) return;
      html += `<p>${paragraph.map(inlineMd).join("<br>")}</p>`;
      paragraph = [];
    };
    const flushList = () => {
      if (!list.length) return;
      html += `<ul>${list.map((item) => `<li>${inlineMd(item)}</li>`).join("")}</ul>`;
      list = [];
    };
    lines.forEach((line) => {
      const trimmed = line.trim();
      if (/^[-*]\s+/.test(trimmed)) {
        flushParagraph();
        list.push(trimmed.replace(/^[-*]\s+/, ""));
      } else {
        flushList();
        paragraph.push(line);
      }
    });
    flushParagraph();
    flushList();
    return html;
  }).join("");
}
function inlineMd(text) {
  return esc(text)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}
function withCites(text) {
  return mdLite(text).replace(/\[(\d{1,2})\]/g, '<span class="cite">$1</span>');
}
function announce(message) {
  const region = $("#liveRegion");
  if (!region) return;
  region.textContent = "";
  window.setTimeout(() => { region.textContent = message; }, 30);
}
function showToast(message) {
  const root = $("#toastRoot");
  if (!root) return;
  root.innerHTML = `<div class="toast" role="status">${esc(message)}</div>`;
  const node = $(".toast", root);
  window.setTimeout(() => {
    if (!node) return;
    node.classList.add("is-out");
    window.setTimeout(() => node.remove(), 170);
  }, 2600);
  announce(message);
}
function autoGrow(el, max = 160) {
  if (!el || el.tagName !== "TEXTAREA") return;
  el.style.height = "auto";
  el.style.height = `${Math.min(el.scrollHeight, max)}px`;
}

/* ----- Preferences ------------------------------------------------------ */
const systemTheme = window.matchMedia("(prefers-color-scheme: dark)");
function defaultPreferences() {
  return { theme: "light", fontSize: "standard", reduceMotion: false, sidebarCollapsed: false };
}
function loadPreferences() {
  try {
    const raw = localStorage.getItem(PREF_KEY);
    if (!raw) return defaultPreferences();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultPreferences(), {
      theme: ["light", "dark", "system"].includes(parsed.theme) ? parsed.theme : "light",
      fontSize: ["small", "standard", "large"].includes(parsed.fontSize) ? parsed.fontSize : "standard",
      reduceMotion: Boolean(parsed.reduceMotion),
      sidebarCollapsed: Boolean(parsed.sidebarCollapsed)
    });
  } catch (error) {
    return defaultPreferences();
  }
}
function savePreferences() {
  try {
    localStorage.setItem(PREF_KEY, JSON.stringify(state.preferences));
  } catch (error) {
    showToast("当前浏览器无法保存偏好，本次选择仍然有效。");
  }
}
function resolvedTheme() {
  if (state.preferences.theme === "system") return systemTheme.matches ? "dark" : "light";
  return state.preferences.theme;
}
function applyPreferences() {
  const body = document.body;
  body.dataset.theme = resolvedTheme();
  body.dataset.fontsize = state.preferences.fontSize;
  body.dataset.motion = state.preferences.reduceMotion ? "reduce" : "auto";
  body.classList.toggle("sidebar-collapsed", state.preferences.sidebarCollapsed && window.innerWidth > 980);
  updateThemeButton();
}
function updateThemeButton() {
  const button = $("#themeBtn");
  if (!button) return;
  const dark = resolvedTheme() === "dark";
  button.innerHTML = `<svg class="icon" aria-hidden="true"><use href="#i-${dark ? "sun" : "moon"}"></use></svg>`;
  button.setAttribute("aria-label", dark ? "切换到浅色模式" : "切换到深色模式");
  button.setAttribute("title", dark ? "切换到浅色模式" : "切换到深色模式");
}

/* ----- Lookups ---------------------------------------------------------- */
const noteById = (id) => state.notes.find((note) => note.id === id) || null;
const sessionById = (id) => state.sessions.find((session) => session.id === id) || null;
const inspirationById = (id) => state.inspirations.find((item) => item.id === id) || null;
const noteIndex = (id) => state.notes.findIndex((note) => note.id === id);
function relatedNotesOf(note) {
  if (!note) return [];
  return (note.related || []).map((entry) => {
    const target = noteById(entry.id);
    return target ? { note: target, strength: entry.strength, reason: entry.reason } : null;
  }).filter(Boolean);
}
function sessionNote(session) {
  return session && session.noteId ? noteById(session.noteId) : null;
}
function sessionLabel(session) {
  if (!session) return "新对话";
  if (session.title && session.title.trim() && session.title !== "新对话") return session.title.trim();
  const note = sessionNote(session);
  if (note) return noteDisplayTitle(note);
  const first = (session.messages || []).find((message) => message.from === "user");
  if (first) return truncate(first.text, 30);
  return "新对话";
}
function sessionRelated(session) {
  if (!session) return [];
  return (session.relatedIds || []).map((id) => noteById(id)).filter((note) => note && note.id !== session.noteId);
}
function sessionRelatedEntries(session) {
  if (!session) return [];
  const bound = sessionNote(session);

}

}
function inspirationMatchesView(item, view) {
  if (view === "saved") return item.userState === "saved";
  if (view === "dismissed") return item.userState === "dismissed";
  return item.userState !== "dismissed";
}
function inspirationsForView(view) {
  return state.inspirations.filter((item) => inspirationMatchesView(item, view));
}

function parseRoute() {
  const hash = location.hash || "#/notes";
  const parts = hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  const root = parts[0] || "notes";
  if (root === "notes") {
    if (parts[1] === "new") return { name: "editor", mode: "new", id: null };
    if (parts[1] && parts[2] === "edit") return { name: "editor", mode: "edit", id: parts[1] };
    if (parts[1]) return { name: "reader", id: parts[1] };
    return { name: "notes" };
  }
  if (root === "chat") {
    if (parts[1] === "note" && parts[2]) return { name: "chat-bound", id: parts[2] };
    if (parts[1] === "session" && parts[2]) return { name: "chat-session", id: parts[2] };
    return { name: "chat" };
  }
  if (root === "inspiration") return { name: "inspiration" };
  if (root === "profile") return { name: "profile" };
  return { name: "notes" };
}
function isChatRoute(route) {

}

/* ----- Focus helpers ---------------------------------------------------- */
function trapFocus(container, event) {
  if (!container) return;
  const focusable = $$("a[href], button:not([disabled]), textarea, input, select, [tabindex]:not([tabindex='-1'])", container)
    .filter((el) => el.offsetParent !== null);
  if (!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault();
    first.focus();
  }
}

/* ---------------------------------------------------------
   Views · renderApp + pages

function validateRoute(route) {
  if (route.name === "reader" && !noteById(route.id)) {
    showToast("这条笔记已经不存在了。");
    history.replaceState(null, "", "#/notes");
    return false;
  }
  if (route.name === "editor" && route.mode === "edit" && !noteById(route.id)) {
    showToast("这条笔记已经不存在了。");
    history.replaceState(null, "", "#/notes");
    return false;
  }
  if (route.name === "chat-session" && !sessionById(route.id)) {
    showToast("无法打开这段对话：记录不存在、已删除或暂时无法读取。请重试。");
    history.replaceState(null, "", "#/chat");
    return false;
  }
  if (route.name === "chat-bound" && !noteById(route.id)) {
    showToast("这条笔记已经不存在了。");
    history.replaceState(null, "", "#/chat");
    return false;
  }
  return true;
}
function prepareRoute(route) {
  if (route.name === "editor") ensureEditor(route);
  if (route.name === "chat") {
    state.boundNoteId = null;
    state.currentSessionId = null;
  } else if (route.name === "chat-bound") {
    state.boundNoteId = route.id;
    state.currentSessionId = null;
  } else if (route.name === "chat-session") {
    const session = sessionById(route.id);
    state.currentSessionId = session.id;
    state.boundNoteId = session.noteId || null;
  } else if (route.name === "inspiration") {
    ensureInspirationSelection();
  }
}
function renderApp(options = {}) {
  const route = parseRoute();
  if (!validateRoute(route)) return;
  const previousDraftKey = chatDraftKey(state.route);
  if (previousDraftKey) state.chatDrafts[previousDraftKey] = state.chatDraft;
  prepareRoute(route);
  const nextDraftKey = chatDraftKey(route);
  state.chatDraft = nextDraftKey ? (state.chatDrafts[nextDraftKey] || "") : "";
  state.route = route;
  const scroller = $("#appMain");
  const priorScroll = scroller ? scroller.scrollTop : 0;
  $("#viewRoot").innerHTML = renderView(route);
  renderChrome(route);
  hydrateView(route);
  if (scroller) scroller.scrollTop = options.keepScroll ? priorScroll : 0;
  if (state.streaming) refreshStreamingDom();
}
function renderView(route) {
  switch (route.name) {
    case "reader": return renderReader(route.id);
    case "editor": return renderEditor(route);
    case "chat": return renderNewChat();
    case "chat-bound": return renderChat(route);
    case "chat-session": return renderChat(route);
    case "inspiration": return renderInspiration();
    case "profile": return renderProfile();
    default: return renderNotes();
  }
}
function hydrateView(route) {
  if (route.name === "notes") {
    const input = $("#quickInput");
    if (input) {
      autoGrow(input, 180);
      input.addEventListener("input", () => {
        autoGrow(input, 180);
        state.quickDraft = input.value;
      });
    }
  }
  if (route.name === "editor") {
    const body = $("#editorBody");
    if (body) {
      body.innerHTML = state.editor.html || "";
      body.addEventListener("paste", handleEditorPaste);
    }
    const title = $("#editorTitle");
    if (title) title.value = state.editor.title || "";
    syncEditorChrome();
    window.setTimeout(() => {
      const target = state.editor.mode === "new" ? $("#editorTitle") : $("#editorBody");
      if (target) target.focus({ preventScroll: true });
    }, 40);
  }
  if (isChatRoute(route)) {

    if (input) {
      autoGrow(input, 150);
      if (!state.streaming || state.streaming.sessionId !== state.currentSessionId) {

  }
}

/* ----- Notes list ------------------------------------------------------- */
function noteGroups() {
  const groups = [];
  const map = new Map();
  state.notes.forEach((note) => {
    const date = new Date(note.createdAt);
    const today = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
    const that = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    const dayDiff = Math.round((today - that) / 86400000);
    let label;
    if (dayDiff === 0) label = "今天";
    else if (dayDiff === 1) label = "昨天";
    else if (date.getFullYear() === NOW.getFullYear() && date.getMonth() === NOW.getMonth()) label = `${date.getFullYear()} 年 ${date.getMonth() + 1} 月`;
    else label = "更早的记录";
    if (!map.has(label)) {
      const group = { label, notes: [] };
      map.set(label, group);
      groups.push(group);
    }
    map.get(label).notes.push(note);
  });
  return groups;
}

/* ----- Editor ----------------------------------------------------------- */
function loadNewDraft() {
  try {
    const raw = localStorage.getItem(NEW_DRAFT_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || (!parsed.title && !parsed.html)) return null;
    return parsed;
  } catch (error) {
    return null;
  }
}
function saveNewDraft() {
  if (!state.editor || state.editor.mode !== "new") return;
  try {
    localStorage.setItem(NEW_DRAFT_KEY, JSON.stringify({ title: state.editor.title, html: state.editor.html }));
  } catch (error) {
    /* local draft is best-effort */
  }
}
function clearNewDraft() {
  try { localStorage.removeItem(NEW_DRAFT_KEY); } catch (error) { /* ignore */ }
}
function ensureEditor(route) {
  const key = route.mode === "new" ? "new" : `edit:${route.id}`;
  if (state.editor && state.editorKey === key) return;
  const note = route.mode === "edit" ? noteById(route.id) : null;
  const draft = route.mode === "new" ? loadNewDraft() : null;
  const quickTitle = route.mode === "new" ? state.quickDraftTitle || "" : "";
  const quickHtml = route.mode === "new" ? state.quickDraftHtml || "" : "";
  state.editorKey = key;
  const initialTitle = note ? note.title : quickTitle || (draft ? draft.title || "" : "");
  const initialHtml = note ? note.html : quickHtml || (draft ? draft.html || "" : "");
  state.editor = {
    key,
    mode: route.mode,
    noteId: note ? note.id : null,
    title: initialTitle,
    html: initialHtml,
    baseline: note ? { title: note.title, html: note.html } : { title: "", html: "" },
    dirty: route.mode === "new" ? Boolean(initialTitle || initialHtml) : false,
    saving: false,
    restored: Boolean(draft && !quickHtml),
    status: "编辑笔记",
    aiLoading: false,
    suggestion: null,
    previousTitle: null
  };
  state.quickDraftTitle = "";
  state.quickDraftHtml = "";
}
function editorDirtyNow() {
  const editor = state.editor;
  if (!editor) return false;
  return editor.title !== editor.baseline.title || editor.html !== editor.baseline.html;
}
function editorTitleError() {
  const title = state.editor ? state.editor.title : "";
  if (title.includes("\n") || title.includes("\r")) return "标题只能占一行。";
  if (Array.from(title.trim()).length > 100) return "标题不能超过 100 个字符。";
  return "";
}

  const statusClass = editor.saving ? "is-saving" : editor.dirty ? "is-dirty" : "";
  const toolButtons = [

    ["sep"],
    ["formatBlock:h2", "heading", "二级标题"],
    ["insertUnorderedList", "list", "无序列表"], ["insertOrderedList", "list-ordered", "有序列表"], ["tasklist", "task", "任务列表"],
    ["formatBlock:blockquote", "quote", "引用"], ["formatBlock:pre", "code", "代码块"], ["insertTable", "table", "插入表格"]
  ];

        </aside>

}
function syncEditorChrome() {
  const editor = state.editor;
  if (!editor) return;
  const statusText = editor.saving ? "正在保存…" : editor.dirty ? "有未保存的修改" : editor.restored ? "已恢复上次未保存的草稿" : editor.mode === "new" ? "新建笔记" : "已保存";
  const status = $("#editorStatus");
  if (status) {
    status.classList.toggle("is-dirty", editor.dirty && !editor.saving);
    status.classList.toggle("is-saving", editor.saving);
    const text = $("#editorStatusText");
    if (text) text.textContent = statusText;
  }
  const saveBtn = $("#saveNoteBtn");
  if (saveBtn) {
    saveBtn.disabled = !editor.dirty || Boolean(editor.saving);
    saveBtn.innerHTML = editor.saving ? `<span class="spinner"></span>保存中…` : "保存";
  }
  const error = $("#titleError");
  if (error) {
    const message = editorTitleError();
    error.textContent = message;
    error.hidden = !message;
  }
  const meta = $("#editorMeta");
  if (meta) {
    meta.textContent = editor.mode === "new"
      ? "新建笔记 · 修改后请保存"
      : editor.noteId ? `最近保存 ${dateClock(noteById(editor.noteId).updatedAt)}` : "";
  }
}

function ensureInspirationSelection() {
  const list = state.inspirations.filter((item) => inspirationMatchesView(item, state.inspirationView));

  if (!current || !inspirationMatchesView(current, state.inspirationView)) {

/* ----- Sidebar drawer focus --------------------------------------------- */
let sidebarReturnFocus = null;
function syncSidebarDrawer() {
  const mobile = window.innerWidth <= 980;
  const open = document.body.classList.contains("sidebar-open");
  const sidebar = $("#sidebar");
  if (sidebar) {
    sidebar.inert = mobile && !open;
    sidebar.setAttribute("aria-hidden", String(mobile && !open));
  }
  const menuButton = $(".topbar-menu");
  if (menuButton) menuButton.setAttribute("aria-expanded", String(mobile && open));
}
function openSidebarDrawer() {
  if (window.innerWidth > 980) return;
  const menuButton = $(".topbar-menu");
  sidebarReturnFocus = document.activeElement && document.activeElement !== document.body ? document.activeElement : menuButton;
  document.body.classList.add("sidebar-open");
  syncSidebarDrawer();
  const target = $("#sideNew") || $("#sidebar .side-nav a.active") || $("#sidebar a.side-brand");
  if (target) window.setTimeout(() => target.focus(), 40);
  announce("主导航已打开。");
}
function closeSidebarDrawer(options = {}) {
  if (!document.body.classList.contains("sidebar-open")) return;
  document.body.classList.remove("sidebar-open");
  syncSidebarDrawer();
  if (options.restore !== false) {
    const target = sidebarReturnFocus && document.contains(sidebarReturnFocus) ? sidebarReturnFocus : $(".topbar-menu");
    if (target) target.focus();
  }
  sidebarReturnFocus = null;
  announce("主导航已关闭。");
}

/* ----- Generic action dispatch ----------------------------------------- */
function handleAction(action, el) {
  switch (action) {
    case "new-note":
      state.quickDraft = "";
      navigate("#/notes/new");
      break;
    case "new-chat": {
      const route = state.route;
      if (route && route.name === "chat") {
        const focused = $("#chatInput");
        if (focused) focused.focus();
        showToast("你已经在新对话中了～");
        return;
      }
      navigate("#/chat");
      break;
    }
    case "toggle-sidebar": {
      if (window.innerWidth <= 980) {
        if (document.body.classList.contains("sidebar-open")) closeSidebarDrawer();
        else openSidebarDrawer();
      } else {
        state.preferences.sidebarCollapsed = !state.preferences.sidebarCollapsed;
        savePreferences();
        applyPreferences();
      }
      break;
    }
    case "close-sidebar":
      closeSidebarDrawer();
      break;
    case "toggle-theme": {
      const next = resolvedTheme() === "dark" ? "light" : "dark";
      state.preferences.theme = next;
      savePreferences();
      applyPreferences();
      renderApp({ keepScroll: true });
      break;
    }
    case "open-settings":
      openSettings("appearance");
      break;
    case "account-menu":
      if (state.menu) { closeMenu(); return; }
      openMenu(el, renderAccountMenu(), { place: "top" });
      break;
    case "close-settings":
      closeTopModal();
      break;
    case "load-more":
      loadMoreNotes();
      break;
    case "expand-capture": {
      const input = $("#quickInput");
      const text = input ? input.value.trim() : "";
      state.quickDraftTitle = "";
      state.quickDraftHtml = text ? `<p>${esc(text).replace(/\n{2,}/g, "</p><p>").replace(/\n/g, "<br>")}</p>` : "";
      state.quickDraft = "";
      navigate("#/notes/new");
      break;
    }
    case "discuss-note":
      discussNote(el.dataset.id || el.getAttribute("data-id"));
      break;
    case "edit-note":
      navigate(`#/notes/${el.dataset.id || ""}/edit`);
      break;
    case "delete-note":
      openDeleteNoteModal(el.dataset.id);
      break;
    case "note-menu":
      openNoteMenu(el);
      break;
    case "related-drawer": {
      const note = noteById(el.dataset.id);
      if (note) openRelatedDrawer(note);
      break;
    }
    case "chat-related-drawer": {
      const session = sessionById(state.currentSessionId);
      if (session) openChatRelatedDrawer(session);
      break;
    }
    case "close-drawer":
      closeRelatedDrawer();
      break;
    case "leave-editor":
    case "cancel-editor": {
      const target = state.editor && state.editor.noteId ? `#/notes/${state.editor.noteId}` : "#/notes";
      requestLeaveEditor(target);
      break;
    }
    case "save-note":
      saveEditor();
      break;
    case "suggest-title":
      suggestTitle();
      break;
    case "apply-title-suggestion":
      applyTitleSuggestion();
      break;
    case "dismiss-title-suggestion":
      dismissTitleSuggestion();
      break;
    case "undo-title-suggestion":
      undoTitleSuggestion();
      break;
    case "toggle-basis": {
      const expanded = el.getAttribute("aria-expanded") === "true";
      el.setAttribute("aria-expanded", String(!expanded));
      const body = el.parentElement.querySelector(".basis-body");
      if (body) body.hidden = expanded;
      break;
    }
    case "open-snapshot-note":
      navigate(`#/notes/${el.dataset.id}`);
      break;
    case "start-care-chat":
      startCareChat(el.dataset.id);
      break;
    case "swap-care":
      state.chatSuggestionIndex = (state.chatSuggestionIndex + 1) % CARE_SUGGESTIONS.length;
      renderApp({ keepScroll: true });
      announce("换了一个建议话题。");
      break;
    case "focus-chat": {
      const input = $("#chatInput");
      if (input) input.focus();
      break;
    }
    case "retry-chat":
      retryChat(el.dataset.session);
      break;
    case "toggle-source": {
      const excerpt = $("[data-source-excerpt]");
      if (!excerpt) return;
      const clamped = excerpt.classList.toggle("is-clamped");
      el.innerHTML = clamped ? `${icon("chevron-down")}展开摘录` : `${icon("chevron-up")}收起摘录`;
      announce(clamped ? "摘录已收起。" : "摘录已展开。");
      break;
    }
    case "research-inspiration":
      startResearchFromAnywhere();
      break;
    case "toggle-save-inspiration":
      toggleSaveInspiration();
      break;
    case "dismiss-inspiration":
      dismissInspiration();
      break;
    case "toggle-source-quote": {
      const quote = el.parentElement.querySelector(".source-quote");
      if (!quote) return;
      const clamped = quote.classList.toggle("is-clamped");
      el.innerHTML = clamped ? `${icon("chevron-down")}展开来源摘录` : `${icon("chevron-up")}收起来源摘录`;
      break;
    }
    case "load-more-inspiration":
      state.inspirationLoadedCount += 3;
      renderApp({ keepScroll: true });
      break;
    case "manage-discovery":
      openSettings("inspiration");
      break;
    case "edit-profile":
      openProfileEditor();
      break;
    case "reanalyze":
      reanalyzePortrait();
      break;
    case "portrait-history":
      openPortraitHistory();
      break;
    case "change-password":
      openPasswordModal();
      break;
    case "open-appearance":
      openSettings("appearance");
      break;
    case "publish-note":
      break;
    default:
      break;
  }
}

/* ----- Quick capture / notes ------------------------------------------- */
function paragraphise(text) {
  return text.split(/\n{2,}/).map((part) => part.trim()).filter(Boolean)
    .map((part) => `<p>${esc(part).replace(/\n/g, "<br>")}</p>`).join("");
}
function createNoteFromText(text) {
  const now = new Date();
  const note = {
    id: `note-${Date.now().toString(36)}`,
    title: "",
    createdAt: now.toISOString(),
    updatedAt: now.toISOString(),
    revision: 1,
    tone: state.notes.length % CARD_TONES.length,
    html: paragraphise(text) || "<p></p>",
    related: []
  };
  state.notes.unshift(note);
  return note;
}
function loadMoreNotes() {
  if (state.loadingMore || state.moreLoaded) return;
  state.loadingMore = true;
  renderApp({ keepScroll: true });
  window.setTimeout(() => {
    const extra = (state.extraNotes || []).splice(0);
    state.notes = state.notes.concat(extra);
    state.loadingMore = false;
    state.moreLoaded = true;
    renderApp({ keepScroll: true });
    announce("已加载更早的笔记。");
    const scroller = $("#appMain");
    if (scroller) scroller.scrollTop = scroller.scrollHeight;
  }, 650);
}
function openDeleteNoteModal(noteId) {
  const note = noteById(noteId);
  if (!note) return;
  openModal({
    title: "删除笔记",
    content: `<p class="confirm-copy">确定要删除这条笔记吗？此操作无法撤销。</p><p class="modal-foot-note" style="margin-top:10px">《${esc(noteDisplayTitle(note))}》· ${dateClock(note.createdAt)}</p>`,
    actions: [
      { label: "取消", value: "cancel", className: "btn secondary modal-cancel" },
      { label: "删除", value: "delete", className: "btn danger" }
    ],
    initialFocus: '[data-modal-action="cancel"]',
    onAction: (value, modal) => {
      if (value === "cancel") { closeModal(modal.id); return; }
      const button = $(`[data-modal-action="delete"]`, $(`[data-modal-id="${modal.id}"]`));
      if (button) { button.disabled = true; button.textContent = "删除中…"; }
      window.setTimeout(() => {
        const index = noteIndex(noteId);
        if (index >= 0) state.notes.splice(index, 1);
        state.sessions.forEach((session) => {
          if (session.noteId === noteId) session.noteId = null;
        });
        if (state.inspirationView) { /* no-op */ }
        closeModal(modal.id, { restore: false });
        const route = state.route;
        if (route.name === "reader" || route.name === "editor") navigate("#/notes", { force: true });
        else renderApp({ keepScroll: true });
        showToast("笔记已删除。");
      }, 450);
    }
  });
}
function openNoteMenu(anchor) {
  const noteId = anchor.dataset.id;
  openMenu(anchor, `
    <button class="menu-item" type="button" role="menuitem" data-menu-action="edit-note" data-id="${noteId}">${icon("edit")}编辑笔记</button>
    <button class="menu-item" type="button" role="menuitem" data-menu-action="discuss-note" data-id="${noteId}">${icon("chat")}和 AI 讨论</button>
    <div class="menu-sep"></div>
    <button class="menu-item is-danger" type="button" role="menuitem" data-menu-action="delete-note" data-id="${noteId}">${icon("trash")}删除笔记</button>`, { align: "right", place: "top" });
}
function discussNote(noteId) {
  const note = noteById(noteId);
  if (!note) return;
  const trigger = $(`[data-action="discuss-note"][data-id="${noteId}"]`);
  if (trigger) {
    trigger.disabled = true;
    trigger.innerHTML = `${icon("loader")}正在创建对话…`;
  }
  window.setTimeout(() => {
    const session = createSession(note.id);
    navigate(`#/chat/session/${session.id}`, { force: true });
    window.setTimeout(() => {
      const input = $("#chatInput");
      if (input) input.focus();
    }, 80);
  }, 600);
}
function createSession(noteId, options = {}) {
  const now = new Date();
  const note = noteId ? noteById(noteId) : null;
  const session = {
    id: `chat-${Date.now().toString(36)}-${Math.floor(Math.random() * 1000)}`,
    noteId: note ? note.id : null,
    title: options.title || "",
    createdAt: now.toISOString(),
    updatedAt: now.toISOString(),
    messages: [],
    relatedIds: note ? (note.related || []).map((entry) => entry.id) : ["n4", "n7", "n8"]
  };
  state.sessions.unshift(session);
  return session;
}
function startCareChat(noteId) {
  if (!noteById(noteId)) return;
  const session = createSession(noteId);
  navigate(`#/chat/session/${session.id}`, { force: true });
  window.setTimeout(() => {
    const input = $("#chatInput");
    if (input) input.focus();
  }, 100);
}

/* ----- Editor ---------------------------------------------------------- */
function requestLeaveEditor(targetHash) {
  if (state.editor && state.editor.dirty) {
    requestUnsavedLeave(targetHash);
    return;
  }
  if (state.editor && state.editor.mode === "new") clearNewDraft();
  state.editor = null;
  state.editorKey = null;
  navigate(targetHash, { force: true });
}
function requestUnsavedLeave(targetHash) {
  state.pendingHash = targetHash;
  openModal({
    kind: "unsaved",
    title: "保存未完成的修改？",
    content: `<p class="confirm-copy">这条笔记还有未保存的内容。</p>`,
    actions: [
      { label: "继续编辑", value: "continue", className: "btn secondary modal-cancel" },
      { label: "放弃修改", value: "discard", className: "btn secondary" },
      { label: "保存并继续", value: "save", className: "btn primary" }
    ],
    initialFocus: '[data-modal-action="continue"]',
    onAction: (value, modal) => {
      if (value === "continue") {
        closeModal(modal.id);
        const body = $("#editorBody");
        if (body) body.focus();
        return;
      }
      if (value === "discard") {
        if (state.editor && state.editor.mode === "new") clearNewDraft();
        state.editor = null;
        state.editorKey = null;
        const target = state.pendingHash || "#/notes";
        state.pendingHash = null;
        closeModal(modal.id, { restore: false });
        navigate(target, { force: true });
        return;
      }
      if (value === "save") {
        const target = state.pendingHash || "#/notes";
        state.pendingHash = null;
        closeModal(modal.id, { restore: false });
        saveEditor({ thenHash: target });
      }
    }
  });
}
function markEditorDirty() {
  if (!state.editor) return;
  state.editor.dirty = editorDirtyNow();
  syncEditorChrome();
  if (state.editor.mode === "new") saveNewDraft();
}
function saveEditor(options = {}) {
  const editor = state.editor;
  if (!editor || editor.saving) return;
  const titleError = editorTitleError();
  if (titleError) {
    showToast(titleError);
    const title = $("#editorTitle");
    if (title) title.focus();
    return;
  }
  const text = stripHtml(editor.html);
  if (editor.mode === "new" && !text) {
    showToast("先写一点内容，再保存。");
    const body = $("#editorBody");
    if (body) body.focus();
    return;
  }
  editor.saving = true;
  syncEditorChrome();
  window.setTimeout(() => {
    const active = state.editor;
    if (!active) return;
    const now = new Date().toISOString();
    let targetId;
    if (active.mode === "new") {
      const note = {
        id: `note-${Date.now().toString(36)}`,
        title: active.title.trim(),
        createdAt: now,
        updatedAt: now,
        revision: 1,
        tone: state.notes.length % CARD_TONES.length,
        html: active.html || "<p></p>",
        related: []
      };
      state.notes.unshift(note);
      targetId = note.id;
      clearNewDraft();
    } else {
      const note = noteById(active.noteId);
      if (!note) { showToast("这条笔记已经不存在了。"); return; }
      note.title = active.title.trim();
      note.html = active.html;
      note.updatedAt = now;
      note.revision = (note.revision || 1) + 1;
      targetId = note.id;
    }
    state.editor = null;
    state.editorKey = null;
    const target = options.thenHash || `#/notes/${targetId}`;
    navigate(target, { force: true });
    showToast("笔记已保存。");
  }, 520);
}
function applyEditorFormat(command) {
  const body = $("#editorBody");
  if (!body) return;
  if (document.activeElement !== body) body.focus();
  if (command.startsWith("formatBlock:")) {
    const tag = command.split(":")[1];
    document.execCommand("formatBlock", false, tag);
  } else if (command === "tasklist") {
    document.execCommand("insertHTML", false, '<ul class="task-list"><li><label><input type="checkbox"> 待办事项</label></li></ul><p><br></p>');
  } else if (command === "insertTable") {
    document.execCommand("insertHTML", false, '<table><thead><tr><th>列一</th><th>列二</th></tr></thead><tbody><tr><td>内容</td><td>内容</td></tr><tr><td>内容</td><td>内容</td></tr></tbody></table><p><br></p>');
  } else {
    document.execCommand(command, false, null);
  }
  state.editor.html = body.innerHTML;
  markEditorDirty();
  const input = $("#editorBody");
  if (input) input.focus();

function suggestTitle() {

    active.aiLoading = false;
    const sentence = firstSentence(text, 18).replace(/…$/, "").replace(/[，。！？、；：""''\s]/g, "");
    const suggestions = [
      `把「${sentence}」留在发生的地方`,
      `关于「${sentence}」的一点记录`,
      `先记下：${sentence}`,
      `${sentence}`
    ];
    active.suggestion = truncate(suggestions[text.length % suggestions.length], 60);
    if (button) { button.classList.remove("is-loading"); button.innerHTML = `${icon("sparkles")}帮我拟个标题`; }

/* ----- Chat ------------------------------------------------------------ */
function buildReply(question, session) {
  const note = sessionNote(session);
  const text = String(question || "").trim();
  if (note) {
    const title = noteDisplayTitle(note);
    return `我把「${title}」又读了一遍。\n\n你问的是「${truncate(text, 44)}」。从这篇记录的语气看，你更在意的可能不是答案，而是这个问题为什么会在此刻出现。\n\n可以先做两个很小的动作：\n- 把问题改写成一句更具体的话，最好带上时间、地点或身体感受。\n- 写下「如果这个判断是错的，最可能错在哪里」。\n\n这两步都不要求现在就得出结论。过一两天回来，只看这两行，看看它们有没有继续长下去。`;
  }
  return `我听到了。你写的是「${truncate(text, 44)}」。\n\n这类问题通常不适合马上给结论。我们可以先把它拆成一个更小的观察：最近一次有这种感觉，是在什么场景里？当时你正在做什么？\n\n如果你愿意，也可以从笔记里的某一句开始，我会沿着那句话继续往下问。`;
}
function chatDraftKey(route) {
  if (!route) return null;
  if (route.name === "chat") return "new";
  if (route.name === "chat-bound") return `bound:${route.id}`;
  if (route.name === "chat-session") return `session:${route.id}`;
  return null;
}
function sendChatMessage(text) {
  const value = String(text || "").trim();
  if (!value) {
    const input = $("#chatInput");
    if (input) input.focus();
    return;
  }
  if (state.streaming) {
    showToast("另一段对话正在回复，请等待完成后再发送；你的草稿已保留。");
    return;
  }
  const route = state.route;
  let session = route.name === "chat-session" ? sessionById(route.id) : null;
  let isNewSession = false;
  if (!session) {
    const noteId = route.name === "chat-bound" ? route.id : null;
    session = createSession(noteId);
    isNewSession = true;
  }
  const note = sessionNote(session);
  const now = new Date();
  session.messages.push({ from: "user", time: timeHM(now.toISOString()), text: value });
  session.updatedAt = now.toISOString();
  session.title = session.title || "";
  const draftKey = chatDraftKey(route);
  if (draftKey) state.chatDrafts[draftKey] = "";
  state.chatDraft = "";
  const snapshot = note ? {
    noteId: note.id,
    title: noteDisplayTitle(note),
    revision: note.revision,
    updatedAt: note.updatedAt,
    text: truncate(noteText(note), 230)
  } : null;
  const shouldFail = /失败|报错/.test(value);
  state.streaming = {
    sessionId: session.id,
    snapshot,
    fullReply: shouldFail ? "" : buildReply(value, session),
    text: "",
    index: 0,
    timer: null,
    failed: shouldFail,
    question: value
  };
  if (isNewSession) {
    navigate(`#/chat/session/${session.id}`, { force: true });
  } else {
    renderApp({ keepScroll: true });
  }
  startStreaming();
}
function startStreaming() {
  const stream = state.streaming;
  if (!stream) return;
  if (stream.failed) {
    window.setTimeout(() => {
      const session = sessionById(stream.sessionId);
      if (!session) { state.streaming = null; return; }
      session.messages.push({
        from: "ai",
        error: true,
        time: timeHM(new Date().toISOString()),
        text: "AI 服务暂不可用，请稍后重试；你的问题已保留。",
        retryText: stream.question
      });
      state.streaming = null;
      renderApp({ keepScroll: true });
      showToast("AI 服务暂不可用，请稍后重试；你的问题已保留。");
    }, 900);
    return;
  }
  const streamLength = stream.fullReply.length;
  stream.timer = window.setInterval(() => {
    if (!state.streaming) {
      window.clearInterval(stream.timer);
      return;
    }
    state.streaming.index += 3;
    state.streaming.text = stream.fullReply.slice(0, state.streaming.index);
    refreshStreamingDom();
    if (state.streaming.index >= streamLength) {
      window.clearInterval(stream.timer);
      finishStreaming();
    }
  }, 16);
}
function refreshStreamingDom() {
  const stream = state.streaming;
  if (!stream) return;
  const bubble = $("#streamBubble .msg-bubble");
  if (!bubble) return;
  if (!stream.text) return;
  let textNode = $(".streaming-text", bubble);
  if (!textNode) {
    bubble.innerHTML = `<div class="msg-meta"><strong>NoteWithAI</strong><span class="ai-identity">${icon("spark")}正在回答</span></div><div class="streaming-text" style="white-space:pre-wrap"></div><span class="streaming-caret" aria-hidden="true"></span>`;
    textNode = $(".streaming-text", bubble);
  }
  if (textNode) textNode.textContent = stream.text;
  const thread = $("#chatThread");
  if (thread) thread.scrollTop = thread.scrollHeight;
}
function finishStreaming() {
  const stream = state.streaming;
  const session = sessionById(stream.sessionId);
  state.streaming = null;
  if (!session) { renderApp({ keepScroll: true }); return; }
  session.messages.push({
    from: "ai",
    time: timeHM(new Date().toISOString()),
    text: stream.fullReply,
    snapshot: stream.snapshot
  });
  session.updatedAt = new Date().toISOString();
  renderApp({ keepScroll: true });
  announce("AI 回复完成。");
}
function retryChat(sessionId) {
  const session = sessionById(sessionId);
  if (!session || state.streaming) return;
  const index = session.messages.findIndex((message) => message.error);
  if (index === -1) return;
  const errorMessage = session.messages[index];
  session.messages.splice(index, 1);
  const note = sessionNote(session);
  state.streaming = {
    sessionId: session.id,
    snapshot: note ? { noteId: note.id, title: noteDisplayTitle(note), revision: note.revision, updatedAt: note.updatedAt, text: truncate(noteText(note), 230) } : null,
    fullReply: buildReply(errorMessage.retryText || "继续说", session),
    text: "",
    index: 0,
    timer: null,
    failed: false,
    question: errorMessage.retryText || ""
  };
  renderApp({ keepScroll: true });
  startStreaming();
}

/* ----- Input handling -------------------------------------------------- */
function handleInput(event) {
  const target = event.target;
  if (!(target instanceof HTMLElement)) return;
  if (target.id === "quickInput") {
    state.quickDraft = target.value;
    return;
  }
  if (target.id === "editorTitle") {
    if (!state.editor) return;
    state.editor.title = target.value;
    markEditorDirty();
    const error = $("#titleError");
    if (error) {
      const message = editorTitleError();
      error.textContent = message;
      error.hidden = !message;
    }
    return;
  }
  if (target.id === "editorBody") {
    if (!state.editor) return;
    state.editor.html = target.innerHTML;
    markEditorDirty();
    return;
  }
  if (target.id === "chatInput") {
    state.chatDraft = target.value;
    autoGrow(target, 150);
    return;
  }
  if (target.id === "sideChatSearch") {
    state.chatSearch = target.value;
    refreshChatList();
    return;
  }
  if (target.matches("[data-profile-field='name']")) {
    if (state.profileEditBuffer) state.profileEditBuffer.name = target.value;
    const error = $("#profileNameError");
    if (error) error.hidden = true;
    const preview = $("#dialogAvatarName");
    if (preview) preview.textContent = target.value.slice(0, 1) || "林";
    return;
  }
}
function handleChange(event) {
  const target = event.target;
  if (!(target instanceof HTMLElement)) return;
  if (target.matches("[data-setting='motion']")) {
    state.preferences.reduceMotion = target.checked;
    savePreferences();
    applyPreferences();
    return;
  }
  if (target.matches("[data-setting='sidebar']")) {
    state.preferences.sidebarCollapsed = target.checked;
    savePreferences();
    applyPreferences();
    return;
  }
  if (target.matches("[data-setting='periodic']")) {
    state.periodic.enabled = target.checked;
    if (target.checked) {
      state.periodic.consentedAt = new Date().toISOString();
      state.periodic.nextEligibleAt = new Date(Date.now() + 24 * 3600 * 1000).toISOString();
    }
    switchSettingsTab("inspiration");
    if (state.route && state.route.name === "inspiration") renderApp({ keepScroll: true });
    showToast(target.checked ? "定期发现已开启。" : "定期发现已关闭，仍可手动研究。");
  }
}
function handleSubmit(event) {
  const form = event.target;
  if (!(form instanceof HTMLFormElement)) return;
  if (form.id === "quickForm") {
    event.preventDefault();
    const input = $("#quickInput");
    const text = input ? input.value.trim() : "";
    if (!text) {
      if (input) input.focus();
      return;
    }
    createNoteFromText(text);
    state.quickDraft = "";
    renderApp({ keepScroll: true });
    showToast("已记下这篇笔记。");
    announce("笔记已记下。");
    return;
  }
  if (form.id === "newChatForm" || form.id === "boundForm" || form.id === "sessionForm") {
    event.preventDefault();
    const input = $("#chatInput");
    if (input) sendChatMessage(input.value);
  }
}
function handleClick(event) {
  const target = event.target;
  if (!(target instanceof Element)) return;
  const skipLink = target.closest(".skip-link");
  if (skipLink) {
    event.preventDefault();
    const main = $("#appMain");
    if (main) {
      main.focus({ preventScroll: true });
      main.scrollTop = 0;
      main.scrollIntoView({ block: "start" });
      announce("已跳到主内容。");
    }
    return;
  }
  const demoSource = target.closest("[data-demo-source]");
  if (demoSource) {
    event.preventDefault();
    openDemoSourceModal(Number(demoSource.dataset.demoSource));
    return;
  }
  const modalClose = target.closest("[data-modal-close]");
  if (modalClose) {
    event.preventDefault();
    closeModal(modalClose.getAttribute("data-modal-close"));
    return;
  }
  const modalAction = target.closest("[data-modal-action]");
  if (modalAction) {
    event.preventDefault();
    const modal = findModal(modalAction.getAttribute("data-modal-id"));
    if (!modal) return;
    if (typeof modal.onAction === "function") modal.onAction(modalAction.getAttribute("data-modal-action"), modal, modalAction);
    else closeModal(modal.id);
    return;
  }
  const menuAction = target.closest("[data-menu-action]");
  if (menuAction) {
    event.preventDefault();
    const value = menuAction.getAttribute("data-menu-action");
    const id = menuAction.getAttribute("data-id");
    closeMenu();
    if (value === "profile") navigate("#/profile");
    else if (value === "settings") openSettings("appearance");
    else if (value === "logout") openLogoutModal();
    else if (value === "edit-note") navigate(`#/notes/${id}/edit`);
    else if (value === "discuss-note") discussNote(id);
    else if (value === "delete-note") openDeleteNoteModal(id);
    return;
  }
  const menuTheme = target.closest("[data-menu-theme]");
  if (menuTheme) {
    event.preventDefault();
    changeTheme(menuTheme.dataset.menuTheme);
    return;
  }
  const settingTab = target.closest("[data-setting-tab]");
  if (settingTab) {
    event.preventDefault();
    switchSettingsTab(settingTab.dataset.settingTab);
    return;
  }
  const themeChoice = target.closest("[data-setting-theme]");
  if (themeChoice) {
    event.preventDefault();
    changeTheme(themeChoice.dataset.settingTheme);
    return;
  }
  const sizeChoice = target.closest("[data-setting-size]");
  if (sizeChoice) {
    event.preventDefault();
    changeFontSize(sizeChoice.dataset.settingSize);
    return;
  }
  const avatarOption = target.closest("[data-avatar-option]");
  if (avatarOption) {
    event.preventDefault();
    if (state.profileEditBuffer) state.profileEditBuffer.avatar = avatarOption.dataset.avatarOption;
    $$(".avatar-option").forEach((option) => option.classList.toggle("is-active", option === avatarOption));
    return;
  }
  const restore = target.closest("[data-restore-inspiration]");
  if (restore) {
    event.preventDefault();
    event.stopPropagation();
    restoreInspiration(restore.dataset.restoreInspiration);
    return;
  }
  const inspirationItem = target.closest("[data-inspiration-id]");
  if (inspirationItem) {
    event.preventDefault();
    selectInspiration(inspirationItem.dataset.inspirationId);
    return;
  }
  const viewPill = target.closest("[data-inspiration-view]");
  if (viewPill) {
    event.preventDefault();
    switchInspirationView(viewPill.dataset.inspirationView);
    return;
  }
  const snapshotView = target.closest("[data-snapshot-view]");
  if (snapshotView) {
    event.preventDefault();
    openPortraitSnapshot(snapshotView.dataset.snapshotView);
    return;
  }
  const format = target.closest("[data-format]");
  if (format) {
    event.preventDefault();
    applyEditorFormat(format.dataset.format);
    return;
  }
  const deleteSession = target.closest("[data-delete-session]");
  if (deleteSession) {
    event.preventDefault();
    event.stopPropagation();
    openDeleteSessionModal(deleteSession.dataset.deleteSession);
    return;
  }
  const sessionRow = target.closest("[data-open-session]");
  if (sessionRow) {
    event.preventDefault();
    navigate(`#/chat/session/${sessionRow.dataset.openSession}`);
    return;
  }
  const actionEl = target.closest("[data-action]");
  if (actionEl) {
    event.preventDefault();
    handleAction(actionEl.dataset.action, actionEl);
    return;
  }
  const anchor = target.closest('a[href^="#/"]');
  if (anchor) {
    event.preventDefault();
    navigate(anchor.getAttribute("href"));
    return;
  }
  if (state.menu) {
    const insideMenu = target.closest(".menu-pop");
    const accountButton = target.closest('[data-action="account-menu"]');
    if (!insideMenu && !accountButton) closeMenu();
  }
}
function handleKeyDown(event) {
  const key = event.key;
  if (key === "Escape") {
    if (state.menu) { closeMenu(); return; }
    if ($("#drawerRoot") && $("#drawerRoot").innerHTML) { closeRelatedDrawer(); return; }
    if (state.modals.length) { closeTopModal(); return; }
    if (document.body.classList.contains("sidebar-open")) { closeSidebarDrawer(); return; }
  }
  if (key === "Tab") {
    if (state.modals.length) {
      const top = state.modals[state.modals.length - 1];
      const layer = $(`[data-modal-id="${top.id}"].modal-layer`);
      trapFocus(layer, event);
      return;
    }
    const drawer = $(".drawer-panel");
    if (drawer) { trapFocus(drawer, event); return; }
    if (document.body.classList.contains("sidebar-open")) { trapFocus($("#sidebar"), event); return; }
  }
  const active = document.activeElement;
  const inChat = active && active.id === "chatInput";
  if (inChat && key === "Enter" && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    sendChatMessage(active.value);
    return;
  }
  if (inChat && key === "Enter" && (event.metaKey || event.ctrlKey)) {
    event.preventDefault();
    sendChatMessage(active.value);
    return;
  }
  if (active && active.id === "editorTitle" && key === "Enter") {
    event.preventDefault();
    const body = $("#editorBody");
    if (body) body.focus();
    return;
  }
  if ((event.metaKey || event.ctrlKey) && key === "Enter") {
    if (state.editor) { event.preventDefault(); saveEditor(); return; }
    if (active && active.id === "quickInput") {
      event.preventDefault();
      const form = $("#quickForm");
      if (form) form.requestSubmit();
      return;
    }
  }
  if (key === "Enter" && active && active.matches("[data-open-session]")) {
    event.preventDefault();
    navigate(`#/chat/session/${active.dataset.openSession}`);
    return;
  }
  if ((key === "Enter" || key === " ") && active && active.matches("[data-inspiration-id]")) {
    event.preventDefault();
    selectInspiration(active.dataset.inspirationId);
  }
}
function handleHashChange() {
  const route = parseRoute();
  const editingSame = state.editor && route.name === "editor" &&
    ((route.mode === "new" && state.editor.mode === "new") || (route.mode === "edit" && route.id === state.editor.noteId));
  if (state.editor && state.editor.dirty && !editingSame) {
    const pending = location.hash;
    const editorHash = state.editor.mode === "new" ? "#/notes/new" : `#/notes/${state.editor.noteId}/edit`;
    history.replaceState(null, "", editorHash);
    requestUnsavedLeave(pending);
    return;
  }
  const drawerWasOpen = document.body.classList.contains("sidebar-open");
  closeMenu();
  closeRelatedDrawer();
  if (drawerWasOpen) closeSidebarDrawer({ restore: false });
  renderApp();
  if (drawerWasOpen) window.setTimeout(() => { const main = $("#appMain"); if (main) main.focus({ preventScroll: true }); }, 60);
}
function handleResize() {
  if (window.innerWidth > 980) document.body.classList.remove("sidebar-open");
  document.body.classList.toggle("sidebar-collapsed", state.preferences.sidebarCollapsed && window.innerWidth > 980);
  syncSidebarDrawer();
}
function handleBeforeUnload(event) {
  if (state.editor && state.editor.dirty) {
    event.preventDefault();
    event.returnValue = "";
    return "";
  }
}
function handleSystemThemeChange() {
  if (state.preferences.theme === "system") {
    applyPreferences();
    renderApp({ keepScroll: true });
  }
}

function handleMouseDown(event) {
  const target = event.target;
  if (target instanceof Element && target.closest("[data-format]")) event.preventDefault();
}

/* ----- Init ------------------------------------------------------------ */
function init() {
  if (!location.hash) history.replaceState(null, "", "#/notes");
  applyPreferences();
  renderApp();
  syncSidebarDrawer();
  document.addEventListener("click", handleClick);
  document.addEventListener("mousedown", handleMouseDown);
  document.addEventListener("input", handleInput);
  document.addEventListener("change", handleChange);
  document.addEventListener("submit", handleSubmit);
  document.addEventListener("keydown", handleKeyDown);
  window.addEventListener("hashchange", handleHashChange);
  window.addEventListener("resize", handleResize);
