<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NoteWithAI · 机器人头像提案</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#202225;background:#f8f9fb;--paper:#fff;--line:#e6e8ed;--muted:#6b707b;--accent:#266fe1;--soft:#edf3fc}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}header{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 48px;background:var(--paper)}.brand{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:650}.brand svg{width:27px}.badge{font-size:12px;color:var(--muted);border-left:1px solid var(--line);padding-left:16px;margin-left:4px;font-weight:400}.theme{background:transparent;border:1px solid var(--line);color:inherit;padding:8px 13px;border-radius:8px;font-size:13px}main{max-width:1336px;margin:auto;padding:46px 48px 36px}.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:34px}h1{font-size:32px;letter-spacing:-1px;font-weight:650;margin:0 0 12px}p{color:var(--muted);font-size:14px;line-height:1.8;margin:0}.edition{font-size:12px;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:32px}.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-content:start}.avatar-card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 12px 15px;text-align:left;color:inherit;min-width:0;transition:border-color .15s}.avatar-card:hover{border-color:#99b7e2}.avatar-card[aria-pressed=true]{border:2px solid var(--accent);padding:15px 11px 14px}.art{width:100%;display:block;aspect-ratio:1;border-radius:50%;overflow:hidden}.avatar-card .art{max-width:156px;margin:0 auto 15px}.name{font-size:14px;font-weight:600;display:block;margin-bottom:4px}.detail{font-size:11px;color:var(--muted)}.check{display:none;position:absolute;right:10px;top:10px;background:var(--accent);color:white;width:21px;height:21px;border-radius:50%;place-items:center;font-size:12px}.avatar-card[aria-pressed=true] .check{display:grid}.side{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;align-self:start}.side-title{font-size:13px;padding:18px 22px;border-bottom:1px solid var(--line);font-weight:550}.portrait{padding:24px 24px 21px;text-align:center}.portrait .art{width:152px;margin:0 auto 16px}.portrait h2{font-size:20px;margin:0 0 6px;font-weight:600}.portrait p{font-size:12px}.contexts{border-top:1px solid var(--line);padding:19px 22px}.context-label{font-size:11px;color:var(--muted);margin-bottom:14px}.account{display:flex;align-items:center;gap:11px}.account .art{width:36px;flex-shrink:0}.account strong{display:block;font-size:13px;font-weight:550}.account small{display:block;font-size:11px;color:var(--muted);margin-top:3px}.dots{margin-left:auto;color:var(--muted)}.message{display:flex;gap:10px;align-items:flex-start}.message .art{width:28px;flex-shrink:0}.bubble{font-size:12px;line-height:1.7;background:var(--soft);padding:10px 12px;border-radius:0 10px 10px 10px}.sizes{display:flex;gap:22px;align-items:end}.sample{text-align:center;font-size:10px;color:var(--muted)}.sample .art{margin-bottom:8px}.section-title{font-size:14px;font-weight:550;margin:30px 0 14px}.comparison{display:flex;align-items:center;gap:24px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px 22px}.old-art{display:flex;gap:8px;opacity:.8}.old-art img{width:38px;height:38px}.comparison p{font-size:12px}.comparison strong{display:block;font-size:12px;font-weight:550;margin-bottom:4px}.comparison .arrow{color:#9b9fa8}.comparison .new-art{display:flex;gap:8px}.new-art .art{width:38px}.note{margin-top:22px;font-size:11px;color:var(--muted);display:flex;gap:8px;align-items:center}.note:before{content:'';width:6px;height:6px;border-radius:50%;background:#8a929e}footer{display:flex;justify-content:space-between;margin-top:30px;font-size:11px;color:var(--muted);padding-top:20px;border-top:1px solid var(--line)}button:focus-visible{outline:3px solid #80aef4;outline-offset:4px}body.dark{background:#212121;color:#f2f2f2;--paper:#292929;--line:#414141;--muted:#b4b4b4;--soft:#333d4c}.dark .theme{background:#292929}@media(min-width:1450px){main{padding-top:55px}.avatar-card{padding-top:23px;padding-bottom:22px}.avatar-card[aria-pressed=true]{padding-top:22px;padding-bottom:21px}}@media(max-width:1100px){main{padding:32px 24px}.layout{gap:20px;grid-template-columns:1fr 290px}.gallery{gap:10px}.detail{font-size:10px}.avatar-card{padding:10px 8px}.avatar-card[aria-pressed=true]{padding:9px 7px}.comparison{gap:14px;padding:14px}.old-art img,.new-art .art{width:28px}}@media(max-width:800px){header{padding:0 22px;height:64px}.badge{display:none}.intro{align-items:start}.edition{display:none}h1{font-size:27px}.layout{grid-template-columns:1fr}.gallery{grid-template-columns:repeat(4,1fr)}.side{display:grid;grid-template-columns:1fr 1fr}.side-title{grid-column:1/-1}.portrait{grid-row:span 2}.contexts{border-top:0;border-left:1px solid var(--line)}.contexts:last-child{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}.comparison{flex-wrap:wrap}.comparison>div:last-child{width:100%}footer{gap:20px;line-height:1.7}}@media(max-width:480px){main{padding:28px 18px}.gallery{grid-template-columns:repeat(2,1fr);gap:12px}.avatar-card{padding:14px}.avatar-card[aria-pressed=true]{padding:13px}.side{display:block}.contexts{border-left:0;border-top:1px solid var(--line)}.portrait .art{width:160px}.detail{font-size:11px}.comparison .old-art img,.comparison .new-art .art{width:30px}}
</style></head><body>
<header><div class="brand"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="20" height="22" rx="5"/><path d="M9 9h10M9 14h10M9 19h6"/></svg>NoteWithAI <span class="badge">头像设计提案</span></div><button class="theme" id="theme">切换深色预览</button></header>
<main><div class="intro"><div><h1>给自己，换个有趣的分身。</h1><p>八位小机器人，各有一点自己的性格。选一位，看看它在笔记里的样子。</p></div><span class="edition">第一版 · 机器人系列</span></div>
<div class="layout"><div><div class="gallery" id="gallery" aria-label="机器人头像备选"></div><h2 class="section-title">从图案，到有性格的分身</h2><div class="comparison"><div class="old-art"><img src="original-avatars/profile-preset-01.svg" alt="现有头像1"><img src="original-avatars/profile-preset-02.svg" alt="现有头像2"><img src="original-avatars/profile-preset-03.svg" alt="现有头像3"></div><span class="arrow" aria-hidden="true">→</span><div class="new-art" id="new-art"></div><div><strong>统一画风，不同个性</strong><p>圆润轮廓、黑白机身、低饱和底色。</p></div></div><div class="note">独立视觉预览：点击头像即可试戴，不会修改账户资料。</div></div>
<aside class="side"><div class="side-title">试戴预览</div><div class="portrait" aria-live="polite"><div id="portrait"></div><h2 id="chosen-name"></h2><p id="chosen-desc"></p></div><div class="contexts"><div class="context-label">侧栏中的你</div><div class="account"><span class="live-avatar art"></span><div><strong>林间笔记</strong><small>个人账户</small></div><span class="dots">···</span></div></div><div class="contexts"><div class="context-label">对话中的你</div><div class="message"><span class="live-avatar art"></span><div class="bubble">把今天的想法记下来，<br>说不定明天就用得上。</div></div></div><div class="contexts"><div class="context-label">小尺寸也看得清</div><div class="sizes" id="sizes"></div></div></aside></div>
<footer><span>设计方向：简洁、机灵、带一点幽默感的机器人。</span><span>仅供选型 · 确认后再接入个人中心</span></footer></main>
<script>
const robots=[
{name:'小机灵',short:'随时有新点子',desc:'一根天线，一点好奇心。',bg:'#e6edf6',head:'classic',eyes:'normal',addon:'antenna'},
{name:'眯眯笑',short:'今天心情不错',desc:'把开心，藏在弯弯的眼睛里。',bg:'#f4e9d9',head:'round',eyes:'happy',addon:'ears'},
{name:'灵感雷达',short:'接收奇思妙想',desc:'正在接收宇宙里的一点灵感。',bg:'#e9e6f5',head:'round',eyes:'wide',addon:'orbit'},
{name:'慢半拍',short:'容我再想一想',desc:'慢一点，也会有好答案。',bg:'#e3eeea',head:'square',eyes:'sleepy',addon:'sprout'},
{name:'酷一点',short:'有自己的主意',desc:'话不多，想法倒是不少。',bg:'#e4e7ed',head:'square',eyes:'cool',addon:'fin'},
{name:'小电波',short:'和世界保持好奇',desc:'戴上耳机，进入自己的频道。',bg:'#f2e3e3',head:'classic',eyes:'normal',addon:'headphones'},
{name:'眨个眼',short:'懂你的小默契',desc:'好主意，我们心照不宣。',bg:'#e9eddb',head:'round',eyes:'wink',addon:'bolt'},
{name:'漫游者',short:'去远一点的地方',desc:'脑袋里，住着一整个宇宙。',bg:'#e2edf0',head:'helmet',eyes:'wide',addon:'space'}
];
function robot(r,i){const ink='#25272b',paper='#fcfcfa';let top='',back='',front='';
if(r.addon==='antenna')top=`<path d="M128 60V38"/><circle cx="128" cy="31" r="8" fill="${paper}"/>`;
if(r.addon==='ears')back='<rect x="45" y="103" width="22" height="42" rx="10" fill="#d8dadd"/><rect x="189" y="103" width="22" height="42" rx="10" fill="#d8dadd"/>';
if(r.addon==='orbit')top='<path d="M128 62V42m0 0 15-12"/><circle cx="148" cy="25" r="7" fill="#fcfcfa"/>';
if(r.addon==='sprout')top='<path d="M128 65V43"/><path d="M128 47c-23 0-26-22-26-22 23-1 29 11 26 22Z" fill="#a2bba4"/><path d="M129 48c0-19 22-26 22-26s3 22-22 26Z" fill="#bdcdb7"/>';
if(r.addon==='fin')top='<path d="m107 63 9-34 23 31" fill="#fcfcfa"/>';
if(r.addon==='headphones')back='<path d="M57 120V98a71 71 0 0 1 142 0v22" fill="none" stroke-width="10"/>';
if(r.addon==='bolt')top='<path d="m130 25-17 24h14l-2 19 21-28h-15l-1-15Z" fill="#d1dba9" stroke-linejoin="round"/>';
let head=r.head==='round'?'<rect x="62" y="62" width="132" height="122" rx="51"/>':r.head==='square'?'<path d="M66 81q0-18 19-18h86q19 0 19 18v80q0 22-24 22H90q-24 0-24-22Z"/>':r.head==='helmet'?'<rect x="57" y="54" width="142" height="139" rx="62"/>':'<rect x="61" y="64" width="134" height="119" rx="35"/>';
let eyes=r.eyes==='happy'?'<path d="M94 120q10-15 20 0m28 0q10-15 20 0" fill="none" stroke="#fcfcfa" stroke-width="6"/>':r.eyes==='wink'?'<rect x="95" y="105" width="13" height="24" rx="6.5" fill="#fcfcfa"/><path d="m143 115 10-6 10 6" fill="none" stroke="#fcfcfa" stroke-width="5"/>':r.eyes==='sleepy'?'<path d="M93 115h19m31 0h19" stroke="#fcfcfa" stroke-width="5"/>':r.eyes==='cool'?'<path d="m91 106 25 5-4 15H96Zm49 5 25-5-5 20h-16Z" fill="#fcfcfa"/><path d="M116 113h25" stroke="#fcfcfa" stroke-width="4"/>':`<rect x="94" y="${r.eyes==='wide'?102:105}" width="14" height="${r.eyes==='wide'?28:23}" rx="7" fill="#fcfcfa"/><rect x="148" y="${r.eyes==='wide'?102:105}" width="14" height="${r.eyes==='wide'?28:23}" rx="7" fill="#fcfcfa"/>`;
if(r.addon==='headphones')front='<rect x="48" y="102" width="21" height="46" rx="9" fill="#d3b1b4"/><rect x="187" y="102" width="21" height="46" rx="9" fill="#d3b1b4"/>';
if(r.addon==='space')front='<circle cx="58" cy="126" r="13" fill="#cadbdf"/><circle cx="198" cy="126" r="13" fill="#cadbdf"/><path d="m97 69 7-9m-1 17 7-9" stroke="#b1c4ca" stroke-width="3"/>';
let mouth=r.eyes==='sleepy'?'<path d="M122 153h12"/>':r.eyes==='cool'?'<path d="m120 151 15-3"/>':'<path d="M118 149q10 10 20 0"/>';
return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="${r.name}"><rect width="256" height="256" fill="${r.bg}"/><g stroke="${ink}" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">${back}${top}<path d="M81 260v-39q0-27 28-27h38q28 0 28 27v39" fill="${paper}"/><path d="M113 182v17q15 10 30 0v-17" fill="#dcdedc"/><g fill="${paper}">${head}</g><rect x="78" y="90" width="100" height="48" rx="22" fill="${ink}" stroke="none"/>${eyes}<g fill="none" stroke-width="3.5">${mouth}</g>${front}<path d="M112 219h32" stroke="#b7b9bc" stroke-width="3"/><circle cx="128" cy="234" r="4" fill="${i===5?'#d3b1b4':'#aab9ca'}" stroke="none"/></g></svg>`}
const gallery=document.querySelector('#gallery');robots.forEach((r,i)=>{const b=document.createElement('button');b.className='avatar-card';b.setAttribute('aria-pressed','false');b.innerHTML=`<span class="check" aria-hidden="true">✓</span><span class="art">${robot(r,i)}</span><span class="name">${r.name}</span><span class="detail">${r.short}</span>`;b.onclick=()=>select(i);gallery.append(b)});
function select(i){const r=robots[i],svg=robot(r,i);[...gallery.children].forEach((el,j)=>el.setAttribute('aria-pressed',String(i===j)));document.querySelector('#portrait').innerHTML=`<div class="art">${svg}</div>`;document.querySelector('#chosen-name').textContent=r.name;document.querySelector('#chosen-desc').textContent=r.desc;document.querySelectorAll('.live-avatar').forEach(el=>el.innerHTML=svg);document.querySelector('#sizes').innerHTML=[24,32,48,80].map(s=>`<div class="sample"><div class="art" style="width:${s}px">${svg}</div>${s}px</div>`).join('')}
document.querySelector('#new-art').innerHTML=robots.slice(0,3).map((r,i)=>`<span class="art">${robot(r,i)}</span>`).join('');document.querySelector('#theme').onclick=()=>{const dark=document.body.classList.toggle('dark');document.querySelector('#theme').textContent=dark?'切换浅色预览':'切换深色预览'};select(0);
</script></body></html>
