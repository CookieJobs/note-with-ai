;margin:8px 0 12px;color:#303a4b}.card .copy{font-size:14px;line-height:1.95;color:#737e8e;white-space:pre-line;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:6;overflow:hidden;margin:0}.kicker{color:#7d9dce;font-size:11px;display:flex;align-items:center;gap:6px}.kicker svg{width:14px}.meta{margin-top:21px;display:flex;align-items:center;justify-content:space-between;color:#a6aeb9;font-size:11px}.meta span:last-child{font-size:18px;line-height:10px}.art{width:100%;height:132px;border-radius:9px;margin-top:16px;overflow:hidden;background:#eff3f7}.art svg{width:100%;height:100%;display:block}.art svg text{font-family:inherit}.quote{border-left:2px solid #bed0ee;padding:1px 0 1px 13px;margin:17px 0 0;color:#667991;font-size:13px}.link-preview{border:1px solid var(--line);border-radius:8px;margin-top:16px;padding:11px;background:#fafbfd;font-size:12px}.link-preview small{display:block;color:#a0a9b7;font-size:10px;margin-top:5px}.end{text-align:center;color:#aeb6c3;font-size:12px;padding-top:33px}.capture{position:fixed;z-index:4;bottom:37px;left:calc(50% + 115px);transform:translateX(-50%);width:min(620px,calc(100% - 330px));border:1px solid #e9edf3;border-radius:22px;background:white;box-shadow:0 7px 22px #26364e10;padding:13px 15px;display:flex;align-items:center;gap:12px}.capture .plus{color:#465165;border-right:1px solid var(--line);padding:0 15px 0 3px;font-size:25px;line-height:22px}.capture:focus-within{border-color:#9ebce9;box-shadow:0 0 0 3px #edf3ff}.capture input{border:0;outline:0;min-width:0;flex:1;color:var(--ink)}.capture input::placeholder{color:#a0a8b4}.capture .send{border-radius:50%;background:#7fa7ed;color:white;width:34px;height:34px;display:grid;place-items:center}.prototype{position:fixed;bottom:7px;left:calc(50% + 115px);transform:translateX(-50%);font-size:10px;color:#99a2b0;white-space:nowrap}.prototype button{font-size:10px;text-decoration:underline;color:#8094b0;padding:0 0 0 7px}dialog{padding:0;border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 100px #1f355b24;color:var(--ink);width:min(920px,calc(100vw - 40px));max-height:88vh}dialog::backdrop{background:#24364c32;backdrop-filter:blur(4px)}.dialog-top{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line);color:#9ba4b1;font-size:12px}.dialog-top button{padding:3px 8px;font-size:17px;color:#6e7d91}.detail-layout{display:grid;grid-template-columns:1fr 230px;min-height:420px}.reading{padding:30px 38px 38px;min-width:0}.reading h2{font-size:24px;line-height:1.6;font-weight:600;margin:5px 0 16px}.reading p{line-height:2.1;white-space:pre-line;color:#5f6c7d}.reading .art{height:200px}.actions{display:flex;gap:8px;margin-top:25px;flex-wrap:wrap}.btn{padding:7px 13px;border:1px solid var(--line);border-radius:8px;font-size:12px;background:#fff}.primary{background:#6c96df;border-color:#6c96df;color:white}.related{border-left:1px solid var(--line);background:#fafbfd;padding:30px 22px}.related h3{font-size:13px;font-weight:500;margin:0 0 20px}.related button{padding:0 0 20px;text-align:left;display:block;font-size:12px}.related button small{display:block;font-size:11px;color:#929daf;margin-top:8px}.related .hint{font-size:10px;color:#a3adbd;line-height:1.7}.edit-title{width:100%;border:0;padding:0;font-size:22px;margin:3px 0 20px}.edit-body{resize:vertical;border:0;width:100%;min-height:280px;color:#647182;line-height:2}.form-wrap{padding:27px 34px}.chat-msg{border-radius:10px;background:#f2f6fc;padding:16px;margin-top:16px;font-size:13px;color:#69788c}.chat-question{display:flex;gap:10px;margin-top:24px}.chat-question input{border:1px solid var(--line);padding:9px 12px;border-radius:8px;flex:1;min-width:0}#toast{position:fixed;z-index:20;top:24px;left:50%;transform:translateX(-50%);background:#32445c;color:#fff;padding:9px 19px;border-radius:10px;font-size:12px;display:none}.empty{text-align:center;color:#8994a5;padding:70px 20px}.info-copy{padding:26px 34px;font-size:13px;line-height:1.95;color:#6f7b8c}.info-copy h2{color:var(--ink);font-size:20px}.mobile-brand{display:none}@media(min-width:1650px){.card{width:calc((100% - 60px)/4)}}@media(max-width:1120px){.sidebar{width:206px;padding:25px 19px}.workspace{margin-left:206px;width:calc(100% - 218px)}.toolbar{padding:23px 24px 16px;gap:14px}.body{padding-left:24px;padding-right:24px}.tab{padding:6px 12px}.search{width:180px}.card{width:calc((100% - 20px)/2)}.capture,.prototype{left:calc(50% + 98px)}}@media(max-width:760px){.sidebar{display:none}.workspace{margin:8px;width:calc(100% - 16px);min-height:calc(100vh - 16px)}.mobile-brand{display:block;font-size:16px;font-weight:700;padding:20px 21px 0}.toolbar{padding:17px 18px;flex-wrap:wrap;gap:12px}.tabs{width:100%;gap:5px}.tab{flex:1;font-size:12px;padding:6px 9px}.search{width:100%;margin:0}.body{padding:0 18px 145px}.feed-heading{margin-bottom:18px}.feed-heading h1{font-size:17px}.feed-heading h1 span{margin-left:7px}.feed-heading small{display:none}.card{width:calc((100% - 14px)/2);padding:16px 14px 12px}.card h2{font-size:14px}.card .copy{font-size:12px;-webkit-line-clamp:5}.art{height:100px}.capture{left:50%;width:calc(100% - 46px);bottom:34px}.prototype{left:50%;font-size:9px}.detail-layout{grid-template-columns:1fr}.related{border-left:0;border-top:1px solid var(--line)}.reading{padding:24px}.reading h2{font-size:21px}.kicker{font-size:10px}.meta{font-size:10px}.brand{font-size:20px}}@media(max-width:420px){.card{width:100%}.art{height:155px}.card .copy{font-size:14px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<script>
const $=s=>document.querySelector(s), icon=n=>`<svg aria-hidden="true"><use href="#${n==='chat'?'chat-icon':n}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const notes=[
{id:1,title:'把生活的颗粒度调小一点',body:'早上没有急着打开手机，先在阳台坐了十分钟。\n\n看见对面屋顶的一只鸟，听见楼下早餐店拉开卷帘门。\n\n以前总觉得这些不值得记录。现在觉得，生活可能就是由这些很小的瞬间组成的。',date:'今天 09:42',type:'long',tint:true,art:'window'},
{id:2,title:'',body:'一个想法：笔记不一定要有结论。\n把问题留下来，本身也是一种记录。',date:'今天 08:16',type:'short'},
{id:3,title:'关于笔记，我想通了一件事',body:'以前写笔记，总想把它整理成一篇完整的文章。标题、结构、结论，缺一个都不想保存。\n\n但真正有价值的，往往是那些还没想清楚的部分。\n\n先记下来，再慢慢想。不要让整理，变成记录的门槛。',date:'昨天 22:08',type:'long',quote:'先保留一个念头，再给它长大的空间。'},
{id:4,title:'读到一句很喜欢的话',body:'“注意力是最稀缺的资源。”\n\n不是时间不够用，而是我的注意力总在被切碎。试试每天留出一个小时，只做一件事。',date:'昨天 17:30',type:'short'},
{id:5,title:'周末，去山里走走',body:'不用安排得太满。找一条没走过的路，带本书，走累了就坐下来。\n\n比起拍多少照片，更想记住那时候的风。',date:'昨天 12:26',type:'short',art:'mountain'},
{id:6,title:'好的工具，让人回到事情本身',body:'看完这篇关于设计的文章，记住一个判断标准：\n\n用完这个工具之后，我是在思考工具怎么用，还是在思考自己原本要做的事？\n\n下次审阅产品时，也试试问自己这个问题。',date:'11 月 5 日 20:14',type:'link',link:'关于设计的日常思考',url:'https://www.nngroup.com/articles/'},
{id:7,title:'',body:'散步的时候突然想到，灵感可能不是凭空出现的。它是以前留下的想法，在某个时刻重新碰到了一起。',date:'11 月 5 日 18:50',type:'short',tint:true},
{id:8,title:'一次不着急的聊天',body:'今天和朋友聊了很久。\n\n没有急着给建议，也没有想着把话题聊出一个结果。只是听对方说完。\n\n有时候，被认真听见，就已经很好了。',date:'11 月 5 日 15:12',type:'short'},
{id:9,title:'给下周的自己',body:'把最重要的一件事安排在上午。\n给临时发生的事情留一点空白。\n少开一个会，多留一段完整的时间。\n\n不需要把每一天都填满。',date:'11 月 3 日 21:07',type:'short'},
{id:10,title:'重读，也是一种新的阅读',body:'翻到去年读书时留下的记录，发现当时划线的地方，今天已经不那么在意了。反倒是一句没标记过的话，让我停了下来。\n\n书没有变，但提问的人变了。',date:'11 月 3 日 10:33',type:'long',art:'book'},
{id:11,title:'',body:'今天试着把“我应该做什么”，换成了“我真正关心什么”。\n\n同一张待办清单，看起来很不一样。',date:'11 月 1 日 16:48',type:'short'},
{id:12,title:'十一月，从这里开始',body:'想多留下一点生活本来的样子。\n\n不追求每天都写，也不追求每次都有收获。只是希望回头看的时候，还能认出当时的自己。',date:'11 月 1 日 09:20',type:'short',tint:true}
];
// 所有图像均为内嵌 SVG 示意插图，不请求外部资源；不意味着现行产品支持图片分类。
function art(kind){let drawing=kind==='mountain'?'<path d="M0 130 100 49l73 57 76-76 130 100Z" fill="#b9ccd3"/><path d="m0 142 135-60 92 45 96-53 77 68v38H0Z" fill="#8eafa5"/><path d="m0 160 150-36 105 30 145-28v54H0Z" fill="#6e948a"/><path d="m148 180 75-43-35 43" fill="#e8dfc5"/>':kind==='window'?'<rect x="230" y="0" width="170" height="180" fill="#f4eadb"/><path d="M230 0h8v180h-8m78-180h7v180h-7M230 83h170v6H230" fill="#d6c4a8"/><path d="M0 170 190 78l44 13L85 180H0" fill="#f7e7c4" opacity=".8"/><ellipse cx="129" cy="143" rx="56" ry="10" fill="#d7cfbb"/><path d="m87 121 52 5 25-9-51-5Z" fill="#fffaf0"/><path d="m88 121 1 12 50 5 24-10 1-11-25 9Z" fill="#d2c5ab"/><path d="M183 109h20v24h-20z" fill="#fffdf5"/><path d="M203 113q18 0 8 15h-8" fill="none" stroke="#fffdf5" stroke-width="4"/>':'<path d="m62 102 138-20 134 22-133 53Z" fill="#b8b5b0"/><path d="m65 91 132-15 137 23-135 48Z" fill="#faf7ec"/><path d="m200 147-1-68M78 96l104 18m-93-8 92 17m38-11 95-12m-95 24 83-13" fill="none" stroke="#d2c9b8" stroke-width="2"/><path d="m292 24 22 13-20 47-21-8Z" fill="#a4b4a2"/>';
return `<div class="art"><svg viewBox="0 0 400 180" role="img" aria-label="${kind==='window'?'阳光、书与窗边的片刻':kind==='mountain'?'山间小路示意插画':'打开的书本示意插画'}" preserveAspectRatio="xMidYMid slice"><rect width="400" height="180" fill="${kind==='mountain'?'#e5edf2':kind==='window'?'#eae9e1':'#e7e8e2'}"/><circle cx="${kind==='mountain'?300:70}" cy="38" r="22" fill="#f5efd9"/>${drawing}</svg></div>`}
let filter='all', current=null,editing=null,chatId=null,restoreFocus=null;
function matches(n){const q=$('#search').value.trim().toLowerCase();return(filter==='all'||n.type===filter)&&(!q||(n.title+' '+n.body).toLowerCase().includes(q))}
function render(){const list=notes.filter(matches);$('#feed').innerHTML=list.map(n=>`<article class="card ${n.tint?'tinted':''}" tabindex="0" role="button" aria-label="阅读笔记：${esc(n.title||n.body.slice(0,24))}" data-open="${n.id}">${n.title?`<div class="kicker">${icon('note')}我的笔记</div><h2>${esc(n.title)}</h2>`:''}<p class="copy">${esc(n.body)}</p>${n.quote?`<div class="quote">${esc(n.quote)}</div>`:''}${n.art?art(n.art):''}${n.link?`<div class="link-preview">↗ ${esc(n.link)}<small>${esc(new URL(n.url).hostname)}</small></div>`:''}<footer class="meta"><span>${esc(n.date)}</span><span aria-hidden="true">···</span></footer></article>`).join('')||'<div class="empty">没有找到这样的笔记。<br>试试其他关键词，或切回全部笔记。</div>';$('#result-count').textContent=`${list.length} 篇笔记`;$('#total').textContent=notes.length;$('#end').hidden=!list.length;layout()}
function layout(){const feed=$('#feed'),cards=[...feed.querySelectorAll('.card')];if(!cards.length){feed.style.height='230px';return}const gap=innerWidth<=760?14:20,w=cards[0].getBoundingClientRect().width,cols=Math.max(1,Math.round((feed.clientWidth+gap)/(w+gap))),heights=Array(cols).fill(0);cards.forEach(c=>{const i=heights.indexOf(Math.min(...heights));c.style.left=(i*(w+gap))+'px';c.style.top=heights[i]+'px';heights[i]+=c.offsetHeight+gap});feed.style.height=Math.max(...heights)+'px'}
function openDialog(id){restoreFocus=document.activeElement;$(id).showModal()}
function topbar(label){return `<div class="dialog-top"><span>${label}</span><button type="button" data-close aria-label="关闭">×</button></div>`}
function read(id){current=notes.find(n=>n.id===id);if(!current)return;const n=current;$('#detail').innerHTML=topbar('笔记 / 阅读')+`<div class="detail-layout"><section class="reading"><div class="kicker">${esc(n.date)}</div><h2 id="detail-title">${esc(n.title||'一则随手记')}</h2><p>${esc(n.body)}</p>${n.art?art(n.art):''}${n.link?`<a href="${esc(n.url)}" target="_blank" rel="noopener noreferrer">${esc(n.link)} ↗</a>`:''}<div class="actions"><button class="btn primary" id="discuss">${icon('spark')} 围绕这篇聊聊</button><button class="btn" id="edit">编辑笔记</button></div></section><aside class="related"><h3>想法之间的线索</h3>${notes.filter(x=>x.id!==id).slice(0,2).map(x=>`<button data-related="${x.id}">${esc(x.title||x.body.slice(0,20))}<small>示例关联 · 同样谈到记录与思考</small></button>`).join('')}<p class="hint">这里演示关联笔记的入口。<br>正式产品沿用现有关联服务。</p></aside></div>`;if(!$('#detail').open)openDialog('#detail');$('#edit').onclick=()=>edit(n);$('#discuss').onclick=()=>chat(n)}
function edit(n){editing=n?.id??null;$('#editor').innerHTML=topbar(n?'笔记 / 编辑':'笔记 / 新建')+`<form id="edit-form" class="form-wrap"><h2 id="editor-label" style="font-size:13px;color:#9ba5b3;font-weight:400">${n?'修改这篇记录':'记下此刻'}</h2><input class="edit-title" id="edit-title" aria-label="标题（可选）" placeholder="标题（可选）" value="${esc(n?.title||'')}"><textarea class="edit-body" id="edit-body" aria-label="笔记正文" placeholder="不必想好，先写下来…" required>${esc(n?.body||'')}</textarea><div class="actions"><button type="submit" class="btn primary">${n?'保存修改':'保存笔记'}</button><button type="button" class="btn" data-close>取消</button></div></form>`;openDialog('#editor');$('#edit-form').onsubmit=e=>{e.preventDefault();const body=$('#edit-body').value.trim(),title=$('#edit-title').value.trim();if(!body)return;let saved;if(editing){saved=notes.find(x=>x.id===editing);saved.title=title;saved.body=body;saved.type=/https?:\/\//.test(body)?'link':body.length>100?'long':'short'}else{saved={id:Date.now(),title,body,date:'刚刚',type:/https?:\/\//.test(body)?'link':body.length>100?'long':'short'};notes.unshift(saved);resetFilters()}$('#editor').close();render();if($('#detail').open)read(saved.id);toast('已保存在本次预览中')};setTimeout(()=>$('#edit-body').focus(),0)}
function chat(n){chatId=n?.id??null;$('#chat').innerHTML=topbar('AI 对话 · 本地演示')+`<div class="form-wrap"><h2 id="chat-label" style="font-size:20px;font-weight:550">${n?'从这篇笔记，继续想下去':'今天，想聊些什么？'}</h2>${n?`<div class="link-preview">${icon('note')} ${esc(n.title||'一则随手记')}<small>本次对话围绕这篇笔记展开</small></div>`:''}<div id="messages"><div class="chat-msg">${n?'你可以追问一个没想清楚的地方，或者换个角度看看这篇笔记。':'写下一个问题，看看对话如何承接你的思考。'}<br><small>此处只演示对话流程，回复为本地预设。</small></div></div><form class="chat-question" id="chat-form"><input aria-label="对话问题" placeholder="你想继续想些什么？" required><button class="btn primary">发送</button></form></div>`;openDialog('#chat');$('#chat-form').onsubmit=e=>{e.preventDefault();const input=e.target.querySelector('input'),q=input.value.trim();if(!q)return;$('#messages').insertAdjacentHTML('beforeend',`<p style="text-align:right">${esc(q)}</p><div class="chat-msg"><small>模拟回复</small><br>${n?'可以从你写下的这句话开始：“'+esc(n.body.split('\n')[0])+'”<br>如果把它放到最近的一次具体经历里，你最想保留的细节是什么？':'先想一个最近发生的具体场景。那时你注意到了什么，又有什么是你想继续追问的？'}</div>`);input.value='';$('#chat').scrollTop=$('#chat').scrollHeight}}
function resetFilters(){filter='all';$('#search').value='';document.querySelectorAll('[data-filter]').forEach(b=>{b.classList.toggle('active',b.dataset.filter==='all');b.setAttribute('aria-pressed',b.dataset.filter==='all')})}
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2400)}
document.addEventListener('click',e=>{const close=e.target.closest('[data-close]');if(close){close.closest('dialog').close();return}const related=e.target.closest('[data-related]');if(related){read(Number(related.dataset.related));return}const card=e.target.closest('[data-open]');if(card)read(Number(card.dataset.open))});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.card')){e.preventDefault();read(Number(e.target.dataset.open))}});document.querySelectorAll('dialog').forEach(d=>{d.addEventListener('close',()=>{if(restoreFocus?.isConnected)restoreFocus.focus()});d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}})});
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',x===b)});render()});$('#search').oninput=render;$('#compose').onclick=()=>edit();$('#quick').onsubmit=e=>{e.preventDefault();const body=$('#quick-text').value.trim();if(!body){$('#quick-text').focus();return}notes.unshift({id:Date.now(),title:'',body,date:'刚刚',type:body.length>100?'long':'short'});$('#quick-text').value='';resetFilters();render();window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});toast('已添加到笔记信息流 · 仅本次预览')};$('#nav-notes').onclick=()=>{resetFilters();render();window.scrollTo(0,0)};$('#nav-chat').onclick=()=>chat();$('#nav-inspiration').onclick=()=>{showInfo('灵感入口','本次原型集中演示笔记信息流。正式产品的灵感研究、历史与收藏继续使用现有页面。')};
function showInfo(title,body){$('#info').innerHTML=topbar('原型说明')+`<div class="info-copy"><h2 id="info-title">${title}</h2>${body}</div>`;openDialog('#info')}
$('#about').onclick=()=>showInfo('从列表，变成可以回看的信息流',`<p>本页是独立 HTML 体验原型，使用虚构的生活与思考笔记。无需联网、登录或后端，刷新会恢复示例。</p><p><b>现有能力的展示调整</b><br>笔记列表改成自适应瀑布流；保留可选标题、正文摘要、创建时间，以及阅读、编辑、关联笔记和绑定笔记的 AI 对话入口。</p><p><b>新增体验提案</b><br>顶部随手记 / 长笔记 / 含链接筛选、关键词搜索、月历和统计属于提案。当前仅对示例笔记生效，随手记与长笔记按示例长度划分；正式接入需要明确分类规则、全库搜索接口与统计口径。</p><p>插图仅演示卡片有视觉内容时的密度，使用内嵌 SVG；真实图片摘要需要额外核对现有富文本和资源权限。此原型不包含语音录入或自动周记。</p><p><b>审阅建议</b><br>尝试筛选、搜索、点开一篇笔记、编辑并保存，再从底部记下一句话。观察卡片是否让回看更轻松，以及瀑布流是否削弱了时间顺序。</p>`);
$('.calendar').innerHTML=Array.from({length:30},(_,i)=>`<span class="day ${[0,2,4,5,6].includes(i)?'recorded':''} ${i===6?'today':''}" title="11 月 ${i+1} 日${[0,2,4,5,6].includes(i)?' · 有记录':''}"></span>`).join('');new ResizeObserver(layout).observe($('#feed'));render();
</script></body></html>
