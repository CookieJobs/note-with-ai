<style>

*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.workspace{min-height:100vh;background:var(--canvas);color:var(--ink);display:flex}.sidebar{width:274px;flex:none;background:var(--sidebar);border-right:1px solid var(--line);padding:22px 14px 16px;display:flex;flex-direction:column;min-height:100vh}.brand{display:flex;align-items:center;gap:10px;padding:0 9px 24px;font-size:16px;font-weight:650}.brand-mark{width:26px;height:26px;border-radius:8px;background:#2365d7;color:white;display:grid;place-items:center;font-weight:700;font-size:15px}.new-note{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:17px;font-weight:550}.nav{display:grid;gap:3px}.nav-item{height:42px;padding:0 12px;display:flex;align-items:center;gap:11px;border-radius:8px;color:var(--muted)}.nav-item.active{background:var(--selected);color:var(--blue-ink);font-weight:550}.nav-item svg{width:18px;height:18px}.section-label{font-size:12px;color:var(--soft);padding:24px 11px 9px}.history{font-size:13px;line-height:1.5;color:var(--muted);padding:0 12px}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding:15px 10px 0;color:var(--muted);font-size:13px;display:flex;gap:10px;align-items:center}.avatar{width:28px;height:28px;border-radius:50%;background:#e7efff;color:#315d9d;display:grid;place-items:center;font-weight:600}.main{min-width:0;flex:1}.prototype-bar{position:sticky;top:0;z-index:4;background:var(--subtle);border-bottom:1px solid var(--line);padding:11px max(22px,calc((100% - 1000px)/2));display:flex;align-items:center;gap:10px;flex-wrap:wrap}.prototype-tag{font-size:12px;font-weight:600;color:var(--muted);padding-right:8px;border-right:1px solid var(--line)}.prototype-bar label{font-size:12px;color:var(--soft)}.prototype-bar select,.prototype-bar button{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12px}.prototype-bar button.selected{border-color:#9bbcf4;color:var(--blue-ink);background:var(--selected)}.prototype-bar .spacer{flex:1}.content{max-width:820px;margin:0 auto;padding:46px 28px 80px}.topline{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:28px}.top-actions{display:flex;align-items:center;gap:14px}.text-button{background:none;border:0;padding:4px;color:var(--muted)}.title{font-size:26px;line-height:1.35;letter-spacing:-.025em;font-weight:620;margin:0 0 8px}.intro{color:var(--muted);font-size:14px;margin:0 0 27px}.composer{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px 17px 12px;box-shadow:var(--shadow);margin-bottom:42px}.composer textarea{resize:vertical;min-height:68px;width:100%;border:0;background:transparent;outline:none;font-size:15px;line-height:1.7}.composer textarea:focus-visible{outline:none}.composer:focus-within{box-shadow:0 0 0 3px var(--focus)}.composer-bottom{display:flex;justify-content:space-between;align-items:center;color:var(--soft);font-size:12px}.composer-bottom button{border:0;background:none;color:var(--blue-ink);font-size:13px;padding:5px 8px}.discovery-head{border-top:1px solid var(--line);padding-top:25px;display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.discovery-head h2{font-size:17px;font-weight:600;margin:0}.subtle{font-size:12px;color:var(--soft)}.discovery{padding:0 0 30px}.discovery h3{font-size:19px;line-height:1.5;letter-spacing:-.01em;margin:0 0 10px;font-weight:620}.summary{font-size:15px;line-height:1.85;margin:0 0 11px;max-width:760px}.why{font-size:13px;line-height:1.7;color:var(--muted);margin:0 0 15px}.inference{display:block;margin-top:5px;color:var(--soft)}.evidence{margin:16px 0 18px;border-left:2px solid #b9cdef;padding-left:14px}.evidence-toggle{font-size:13px;color:var(--blue-ink);background:none;border:0;padding:2px 0 8px;display:flex;align-items:center;gap:6px}.evidence-list{display:grid;gap:12px}[hidden]{display:none!important}.quote{font-size:13px;line-height:1.75;color:var(--muted);margin:0}.quote strong{color:var(--ink);font-weight:550}.quote cite{display:block;color:var(--soft);font-style:normal;font-size:12px;margin-top:3px}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.primary{background:var(--blue);color:white;border:1px solid var(--blue);border-radius:8px;padding:8px 13px;font-weight:550}.primary:hover{background:var(--blue-hover)}.secondary,.quiet{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px}.quiet{border-color:transparent;color:var(--muted)}.secondary:hover,.quiet:hover,.text-button:hover{background:var(--subtle)}.feedback{margin-top:14px;display:flex;gap:14px}.feedback button{font-size:12px;color:var(--soft);background:none;border:0;padding:4px 0;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px}.feedback button:hover{text-decoration-color:currentColor}.other{margin-top:12px}.other button{padding-left:0}.empty{padding:14px 0 24px;color:var(--muted);line-height:1.8}.state-panel{padding:18px 20px;border:1px solid var(--line);border-radius:10px;background:var(--subtle);margin:4px 0 20px}.state-panel strong{display:block;color:var(--ink);font-size:14px;margin-bottom:5px}.state-panel p{margin:0;color:var(--muted);font-size:13px;line-height:1.7}.state-panel button{margin-top:11px;background:none;color:var(--blue-ink);border:0;padding:0;font-size:13px}.spinner{width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;display:inline-block;vertical-align:-3px;margin-right:7px;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.draft{margin:18px 0;border-top:1px solid var(--line);padding-top:16px}.draft h4{margin:0 0 7px;font-size:14px;font-weight:600}.draft textarea{width:100%;min-height:118px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:12px;font-size:14px;line-height:1.8}.saved-note{color:var(--muted);font-size:13px;margin-left:8px}.chat{margin-top:20px;border-top:1px solid var(--line);padding-top:19px}.chat-source{font-size:12px;color:var(--muted);margin-bottom:16px}.message{font-size:14px;line-height:1.8;margin:0 0 13px}.message.user{text-align:right}.bubble{white-space:pre-wrap;display:inline-block;max-width:86%;padding:10px 13px;background:var(--subtle);border-radius:12px}.message.user .bubble{background:var(--selected)}.ask{display:flex;gap:8px;margin-top:16px}.ask input{min-width:0;flex:1;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--surface)}dialog{width:min(560px,calc(100% - 32px));max-height:min(78vh,720px);padding:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);box-shadow:0 16px 55px rgba(0,0,0,.22)}dialog::backdrop{background:rgba(12,18,28,.35)}.dialog-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:16px 20px}.dialog-head h2{font-size:18px;margin:0}.dialog-body{padding:19px 20px;max-height:58vh;overflow:auto}.dialog-body p{font-size:14px;line-height:1.8}.icon-button{width:32px;height:32px;border:0;border-radius:7px;background:transparent;display:grid;place-items:center}.icon-button:hover{background:var(--subtle)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:900px){.sidebar{width:230px}.prototype-bar{padding:10px 18px}.content{padding:34px 22px 60px}}@media(max-width:680px){.sidebar{display:none}.prototype-bar{position:relative;padding:10px 14px}.prototype-tag{width:100%;border:0}.content{padding:28px 18px 50px}.title{font-size:23px}.topline{margin-bottom:22px}.prototype-bar .spacer{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<body>
<div class="workspace" id="workspace" data-theme="light">
<aside class="sidebar" aria-label="工作区侧栏">
  <div class="brand"><span class="brand-mark" aria-hidden="true">N</span>NoteWithAI</div>
  <div class="new-note" aria-hidden="true">＋　新建笔记</div>
  <nav class="nav" aria-label="工作区"><div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H20v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M4 17h16M8 8h8M8 11h6"/></svg>笔记</div><div class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H20v14H7.5A2.5 2.5 0 0 0 5 19.5z"/><path d="M5 6v14M9 8h7M9 11h6"/></svg>AI 对话</div><div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3 9.8 9.8 3 12l6.8 2.2L12 21l2.2-6.8L21 12l-6.8-2.2z"/></svg>灵感</div></nav>
  <div class="section-label">最近</div><div class="history">如何让会议决定更容易落地<br><br>街角咖啡店的观察<br><br>给新同事的第一周清单</div>
  <div class="side-bottom"><span class="avatar">林</span>林舟</div>
</aside>
<main class="main">
  <section class="prototype-bar" aria-label="原型状态切换工具">
    <span class="prototype-tag">原型控制 · 模拟数据</span>
    <label for="kind">发现</label><select id="kind"><option value="connection">跨笔记联系</option><option value="follow">旧问题的新线索</option><option value="next">推进一份草稿</option></select>
    <label for="state">状态</label><select id="state"><option value="ready">有发现</option><option value="empty">无结果</option><option value="running">分析中</option><option value="limit">额度已用完</option><option value="failed">暂时失败</option></select>
    <span class="spacer"></span><button id="themeToggle" type="button">切换深色</button>
  </section>
  <div class="content">
    <div class="topline"><span>AI 对话</span><div class="top-actions"><button class="text-button" id="autoToggle" aria-pressed="true">自动发现：开启</button><button class="icon-button" id="themeIcon" aria-label="切换深色主题" title="切换主题"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20.5 15.5A8 8 0 0 1 8.5 3.5a8.5 8.5 0 1 0 12 12z"/></svg></button></div></div>
    <h1 class="title">今天，想从哪里聊起？</h1><p class="intro">写下正在想的事，也可以从一条发现继续聊。</p>
    <div class="composer"><label class="sr-only" for="noteInput">输入问题</label><textarea id="noteInput" placeholder="写下你的问题或想法…"></textarea><div class="composer-bottom"><span id="noteHint">你可以直接提问，或从下面的发现开始</span><button id="recordButton">开始对话</button></div></div>
    <section id="ordinaryChat" class="chat" hidden aria-label="普通对话"><div class="chat-source">普通对话 · 模拟回复，未绑定笔记</div><div id="ordinaryMessages"></div></section><div class="discovery-head"><h2>从你的笔记继续</h2><span class="subtle" id="countLabel">为你选出的一条发现</span></div>
    <div id="statePanel" class="state-panel" hidden></div>
    <section class="discovery" id="discovery" aria-live="polite"></section>
    <div class="other"><button class="quiet" id="otherButton">查看其他发现</button></div>
  </div>
</main>
<dialog id="sourceDialog" aria-labelledby="dialogTitle"><div class="dialog-head"><h2 id="dialogTitle">来源笔记</h2><button class="icon-button" data-close-dialog aria-label="关闭"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="dialog-body" id="dialogBody"></div></dialog>
</div>
<script>
const data={
 connection:{title:'两次关于“交接”的记录，指向同一个小缺口',summary:'项目复盘和轮班记录都提到：接手的人拿到了最终方案或规则，却不知道当时为什么这样决定。',why:'两条原文来自不同场景，相隔三周；共同点是决定依据没有随交接留下。推测：一行“当时依据”或许有帮助，但目前不足以说明它适用于所有交接。',sources:[{title:'远程项目复盘',date:'2026年10月28日',quote:'需求改动后，接手的人只看到了最终文档，不知道为什么删掉了原来的方案。下次要不要把关键取舍也留在交接里？'},{title:'客户支持轮班记录',date:'2026年11月16日',quote:'轮班表交接了，但那条退款规则是怎么定的，没人说得清。我准备把处理步骤写上，理由还没想好放在哪里。'}],action:'先用两段原文试填一个交接样例：决定｜当时依据｜仍不确定。再对照两次交接，看“依据”是否正是缺失项。',answer:'按现有两条记录，样例可以是：\n决定：采用新的需求方案 / 按退款规则处理\n当时依据：待补（原文只说方案被删、规则已存在）\n仍不确定：为什么选这个方案 / 退款规则由谁、何时确认\n\n这也显示了证据的边界：记录支持“接手者不知道理由”，但没有说明理由当时是否记在别处。',draft:'# 交接备注（试用）\n\n决定：\n当时依据：\n仍不确定：'},
 follow:{title:'你之前想验证的“先写结论”，后来有了一条实际线索',summary:'10 月 22 日，你问：“如果会前先写下结论，讨论会不会更聚焦？”11 月 12 日的一次会议先发了两段方案和推荐，会上只讨论成本差异，并定下试点范围。它提供了一次具体尝试，但没有记录会议是否因此更快。',why:'新记录出现了与旧问题相符的做法和结果；目前只有一次案例。推测：会前给出推荐可能让讨论聚焦在分歧上，仍不能判断它比其他因素更关键。',sources:[{title:'周会复盘：讨论总是从头开始',date:'2026年10月22日',quote:'如果会前先写下结论和两个备选方案，讨论会不会更聚焦？下次试一次，记得比较会议有没有少绕圈。'},{title:'项目试点范围确认',date:'2026年11月12日',quote:'这次先发了两段方案和我的推荐。会上只讨论了成本差异，最后半小时定下试点范围。会后还没复盘时间是不是更短。'}],action:'把这次和一场未提前发推荐的类似会议并排比较：参会人数、议题复杂度、讨论焦点和定案时间。',answer:'可确认的结果是：讨论集中在成本差异，最后确定了试点范围。旧问题里的“更聚焦”有了一个实例；“是否更快”仍待比较。下一步补充一场同类会议的议题和定案时间，避免把人数或复杂度差异误当成效果。',draft:''},
 next:{title:'把这几次用户访谈整理成一份可讨论的研究简报',summary:'三条访谈都提到先用个人工具整理信息，需要协作时再转入共享文档。可以把它们整理成一页简报：共同行为、切换时刻、现有办法和待验证的问题。',why:'三个案例足以搭出初稿结构；仍缺出现频率和典型反例。推测：协作需求可能是切换到共享工具的触发点，但这些摘录不能代表全部访谈。',sources:[{title:'访谈 A：每周整理报销',date:'2026年11月5日',quote:'我先在自己的表格里把票据对好，月底要给财务看时才搬到共享盘。'},{title:'访谈 B：排期与分工',date:'2026年11月9日',quote:'事情不多的时候记在便签里，一旦要和设计师对齐，就放到项目文档。'},{title:'访谈 C：跟进供应商',date:'2026年11月14日',quote:'我自己有一份清单，采购要一起看状态时，我们再复制到共享表格。'}],action:'先形成一页研究简报，再补上频率、反例和适用范围。',answer:'简报结构已由三条原文支撑：共同行为是先个人整理、协作时再迁移；触发时刻分别是财务查看、设计对齐、采购共看状态。现在不能说这代表全部访谈，也不知道迁移是否造成困扰。下一步统计出现次数，并找一条无需迁移的反例。',draft:'# 研究简报：从个人整理到协作共享\n\n## 观察到的行为\n三次访谈都提到先用个人工具整理信息，出现协作需求后再转入共享文档。\n\n## 切换时刻\n- 需要财务查看票据时\n- 需要与设计师对齐排期时\n- 需要采购共同查看供应商状态时\n\n## 初步假设\n协作需求可能是切换到共享工具的触发点。\n\n## 还需补充\n- 这种做法在全部访谈中出现的频率\n- 不需要切换工具的反例\n- 用户认为复制或迁移过程中的主要成本'}
};
let kind='connection',state='ready',auto=true,otherOpen=false;const ui={};for(const k of Object.keys(data))ui[k]={feedback:null,draft:data[k].draft,draftOpen:false,chat:false,messages:[],question:"",saved:false};
const el=id=>document.getElementById(id),esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const d=data[kind],u=ui[kind],box=el('discovery'),panel=el('statePanel');el('countLabel').textContent=state==='ready'?(otherOpen?'已显示其他发现':'为你选出的一条发现'):'发现状态';el('otherButton').hidden=state!=='ready';panel.hidden=state==='ready';box.hidden=state!=='ready';if(state!=='ready'){const states={empty:['暂时没有新的发现','现有笔记里还没有足够明确的线索。你可以继续记录，之后再来看看。','再检查一次'],running:['正在整理近期笔记','找到线索后会显示原文依据。你可以先继续写笔记。','检查完成'],limit:['今天的自动发现额度已用完','已有的发现仍可查看。额度恢复后会继续检查新的记录。','查看已有发现'],failed:['这次没有完成分析','保存的笔记不会受影响。稍后可以再试一次。','重新尝试']};const [h,p,b]=states[state];panel.innerHTML=`<strong>${state==='running'?'<span class="spinner" aria-hidden="true"></span>':''}${h}</strong><p>${p}</p><button id="stateAction">${b}</button>`;el('stateAction').onclick=()=>setState(state==='failed'?'running':'ready');return}
if(otherOpen){box.innerHTML=Object.keys(data).filter(k=>k!==kind).map(k=>`<article style="padding:14px 0;border-bottom:1px solid var(--line)"><h3 style="font-size:16px;margin:0 0 6px">${esc(data[k].title)}</h3><p class="summary" style="font-size:14px">${esc(data[k].summary)}</p><button class="secondary" data-open-kind="${k}">查看这条发现</button></article>`).join('')+`<button class="quiet" id="backCurrent">返回当前发现</button>`;box.querySelectorAll('[data-open-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.openKind;el('kind').value=kind;otherOpen=false;state='ready';render()});el('backCurrent').onclick=()=>{otherOpen=false;render()};return}
const q=d.sources.map(s=>`<p class="quote"><strong>${esc(s.title)}</strong> · ${esc(s.date)}<br>“${esc(s.quote)}”</p>`).join('');box.innerHTML=`${u.feedback?`<div class="state-panel"><strong>${u.feedback==='dismiss'?'已标记为不感兴趣':u.feedback==='false'?'已标记为联系不成立':'已标记为这件事已经结束'}</strong><p>这条发现已从当前列表收起。你可以撤销反馈。</p><button id="undoFeedback">撤销</button></div>`:`<h3>${esc(d.title)}</h3><p class="summary">${esc(d.summary)}</p><p class="why">${esc(d.why)}</p><div class="evidence"><button class="evidence-toggle" id="evidenceToggle" aria-expanded="false"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 18 6-6-6-6"/></svg><span>展开原文依据（${d.sources.length}）</span></button><div id="evidenceList" class="evidence-list" hidden>${q}</div></div><div class="actions"><button class="primary" id="continueButton">${u.chat?'继续对话':'继续探索'}</button><button class="secondary" id="sourceButton">查看来源</button>${d.draft?`<button class="secondary" id="draftButton">编辑成果草稿</button>`:''}</div>${d.draft?`<div class="draft" id="draftArea" ${u.draftOpen?'':'hidden'}><h4>成果草稿</h4><p class="subtle">保存为新笔记的模拟预览；原始记录不会被修改。</p><textarea id="draftText" ${u.saved?"readonly":""} aria-label="编辑成果草稿">${esc(u.draft)}</textarea><div class="actions" style="margin-top:9px"><button class="primary" id="saveDraft" ${u.saved?"disabled":""}>${u.saved?'已模拟保存':'模拟保存为新笔记'}</button><span class="saved-note" id="savedNote" aria-live="polite">${u.saved?'已模拟保存为新笔记':''}</span></div></div>`:''}<p class="subtle" style="margin:16px 0 0">${esc(d.action)}</p><div class="feedback"><button data-feedback="dismiss">不感兴趣</button><button data-feedback="false">联系不成立</button><button data-feedback="done">这件事已经结束</button></div>${u.chat?chatMarkup():''}`}`;
const toggle=el('evidenceToggle');if(toggle)toggle.onclick=()=>{const list=el('evidenceList'),open=list.hidden;list.hidden=!open;toggle.setAttribute('aria-expanded',String(open));toggle.querySelector('span').textContent=(open?'收起':'展开')+`原文依据（${d.sources.length}）`;toggle.querySelector('svg').style.transform=open?'rotate(90deg)':''};const src=el('sourceButton');if(src)src.onclick=()=>openSource(d);const con=el('continueButton');if(con)con.onclick=()=>{u.chat=true;render();el('askInput')?.focus()};const draftBtn=el('draftButton');if(draftBtn)draftBtn.onclick=()=>{u.draftOpen=!u.draftOpen;render();if(u.draftOpen)el('draftText').focus()};const draftText=el('draftText');if(draftText)draftText.oninput=()=>u.draft=draftText.value;const save=el('saveDraft');if(save)save.onclick=()=>{if(u.saved)return;u.draft=el('draftText').value;u.saved=true;render();el('draftArea').hidden=false};box.querySelectorAll('[data-feedback]').forEach(b=>b.onclick=()=>{u.feedback=b.dataset.feedback;render()});const undo=el('undoFeedback');if(undo)undo.onclick=()=>{u.feedback=null;render()};const send=el('sendQuestion');if(send)send.onclick=sendQuestion;const input=el('askInput');if(input)input.oninput=()=>u.question=input.value;if(input)input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendQuestion()}}}
function chatMarkup(){const d=data[kind],u=ui[kind];return `<div class="chat" aria-live="polite"><div class="chat-source">本次对话依据：${d.sources.map(s=>esc(s.title)).join('、')} · 模拟来源快照</div><p class="message"><span class="bubble">${esc(d.answer)}</span></p><div id="chatMessages">${u.messages.join('')}</div><form class="ask" onsubmit="return false"><input id="askInput" value="${esc(u.question)}" placeholder="接着问一个问题…" aria-label="输入问题"><button class="primary" id="sendQuestion" type="button">发送</button></form></div>`}
function sendQuestion(){const input=el('askInput');if(!input||!input.value.trim())return;const msg=input.value.trim(),d=data[kind];ui[kind].question='';ui[kind].messages.push(`<p class="message user"><span class="bubble">${esc(msg)}</span></p><p class="message"><span class="bubble">结合“${esc(d.sources[0].title)}”的原文，当前可以确认：${esc(d.sources[0].quote)} 这仍是有限样本。下一步可以把这条记录与另一条情境相近的记录并排核对，区分原文事实和待验证推测。</span></p>`);render();el('askInput')?.focus()}
function openSource(d){el('dialogBody').innerHTML=d.sources.map((s,i)=>`<article><p class="subtle">来源 ${i+1} · ${esc(s.date)}</p><h3 style="font-size:16px;margin:0">${esc(s.title)}</h3><p>“${esc(s.quote)}”</p></article>`).join('<hr style="border:0;border-top:1px solid var(--line)">');el('sourceDialog').showModal()}
function setState(next){state=next;el('state').value=next;render()}const dlg=el('sourceDialog');dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});dlg.querySelector('[data-close-dialog]').onclick=()=>dlg.close();dlg.addEventListener('close',()=>el('sourceButton')?.focus());el('kind').onchange=e=>{kind=e.target.value;otherOpen=false;state='ready';el('state').value='ready';render()};el('state').onchange=e=>setState(e.target.value);function toggleTheme(){const w=el('workspace');w.dataset.theme=w.dataset.theme==='light'?'dark':'light';el('themeToggle').textContent=w.dataset.theme==='dark'?'切换浅色':'切换深色';el('themeIcon').setAttribute('aria-label',w.dataset.theme==='dark'?'切换浅色主题':'切换深色主题')}el('themeToggle').onclick=toggleTheme;el('themeIcon').onclick=toggleTheme;el('autoToggle').onclick=()=>{auto=!auto;el('autoToggle').textContent='自动发现：'+(auto?'开启':'关闭');el('autoToggle').setAttribute('aria-pressed',String(auto))};el('otherButton').onclick=()=>{otherOpen=true;render()};el('recordButton').onclick=()=>{const t=el('noteInput');if(!t.value.trim()){t.focus();return}el('ordinaryChat').hidden=false;el('ordinaryMessages').insertAdjacentHTML('beforeend',`<p class="message user"><span class="bubble">${esc(t.value.trim())}</span></p><p class="message"><span class="bubble">这是普通对话的模拟回复。你可以继续补充想法；若想沿着笔记中的发现深入，请选择下方的“继续探索”。</span></p>`);t.value='';el('ordinaryChat').scrollIntoView({block:'nearest'});t.focus()};render();
</script>
</body></html>
